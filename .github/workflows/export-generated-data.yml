name: Export generated data

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  export-generated-data:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'export-generated-data'
    environment: uat  # ephemeral environments run in the UAT cluster namespace
    permissions:
      id-token: write
      contents: read
    env:
      RELEASE_NAME: pr-${{ github.event.pull_request.number }}
      RECORD_COUNT: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run deploy prerequisites
        id: deploy_prerequisites
        uses: ./.github/actions/deploy_prerequisites
        with:
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}
          ecr-role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          ecr-region: ${{ vars.ECR_REGION }}

      - name: Run mass generator
        shell: bash
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
          ECR_REGISTRY: ${{ steps.deploy_prerequisites.outputs.ecr-registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          set -euo pipefail

          HELM_RELEASE="${RELEASE_NAME}-mass-generator-job"
          JOB_NAME="${HELM_RELEASE}-job"

          # Retrieve the image tag from the existing mass generator deployment
          IMAGE_TAG=$(kubectl get deployment "${RELEASE_NAME}-mass-generator-mass-generator" \
            -n "$KUBE_NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}' \
            | cut -d: -f2)

          if [ -z "$IMAGE_TAG" ]; then
            echo "Could not retrieve image tag from deployment ${RELEASE_NAME}-mass-generator-mass-generator" >&2
            exit 1
          fi

          echo "Using image tag: $IMAGE_TAG"

          # Delete any previous job to allow re-runs
          kubectl delete job "$JOB_NAME" -n "$KUBE_NAMESPACE" --ignore-not-found

          # Deploy the mass generator job via its own isolated Helm chart
          helm upgrade "$HELM_RELEASE" .helm/mass-generator-job \
            --namespace "$KUBE_NAMESPACE" \
            --set image.repository="${ECR_REGISTRY}/${ECR_REPOSITORY}" \
            --set image.tag="${IMAGE_TAG}" \
            --set spring.profile="preview" \
            --set db.postgresqlReleaseName="${RELEASE_NAME}-postgresql" \
            --set job.recordCount="${RECORD_COUNT}" \
            --install \
            --wait

          echo "Waiting for mass generator job to complete..."
          kubectl wait job "$JOB_NAME" \
            -n "$KUBE_NAMESPACE" \
            --for=condition=complete \
            --timeout=3600s

          echo "Mass generator job completed successfully"

      - name: Run smoke tests
        uses: ./.github/actions/smoke-test
        with:
          release-name: ${{ env.RELEASE_NAME }}
          branch-name: ${{ github.head_ref }}
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          report-name: export-smoke-test-report

      - name: Take and upload pg_dump snapshot
        id: pg_dump
        shell: bash
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
          S3_BUCKET: MassGeneratorSnapshots
        run: |
          set -euo pipefail

          PG_RELEASE="${RELEASE_NAME}-postgresql"
          HELM_RELEASE="${RELEASE_NAME}-pg-dump"
          JOB_NAME="${HELM_RELEASE}-job"

          # Retrieve the PostgreSQL image from the existing StatefulSet to ensure version match
          PG_IMAGE=$(kubectl get statefulset "$PG_RELEASE" \
            -n "$KUBE_NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}')

          if [ -z "$PG_IMAGE" ]; then
            echo "Could not retrieve image from StatefulSet ${PG_RELEASE}" >&2
            exit 1
          fi

          PG_IMAGE_REPO=$(echo "$PG_IMAGE" | cut -d: -f1)
          PG_IMAGE_TAG=$(echo "$PG_IMAGE" | cut -d: -f2)
          echo "Using PostgreSQL image: $PG_IMAGE"

          # Delete any previous job to allow re-runs
          kubectl delete job "$JOB_NAME" -n "$KUBE_NAMESPACE" --ignore-not-found

          # Deploy the pg_dump job via its own isolated Helm chart.
          # The job uses an init container (pg_dump) and a main container (aws s3 cp)
          # sharing an emptyDir volume — no kubectl logs or exec required.
          # IRSA on the pod handles S3 credentials; the runner ECR role is not used here.
          helm upgrade "$HELM_RELEASE" .helm/pg-dump-job \
            --namespace "$KUBE_NAMESPACE" \
            --set pgDump.image.repository="$PG_IMAGE_REPO" \
            --set pgDump.image.tag="$PG_IMAGE_TAG" \
            --set db.host="$PG_RELEASE" \
            --set db.secretName="$PG_RELEASE" \
            --set awsUpload.s3.bucket="$S3_BUCKET" \
            --set awsUpload.s3.prefix="snapshots/${RELEASE_NAME}" \
            --install \
            --wait

          echo "Waiting for pg_dump and S3 upload to complete..."
          kubectl wait job "$JOB_NAME" \
            -n "$KUBE_NAMESPACE" \
            --for=condition=complete \
            --timeout=300s

          echo "Snapshot successfully uploaded to S3"
