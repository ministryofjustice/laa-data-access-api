name: Export generated data

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  export-generated-data:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'export-generated-data'
    environment: uat  # ephemeral environments run in the UAT cluster namespace
    permissions:
      id-token: write
      contents: read
    env:
      RELEASE_NAME: pr-${{ github.event.pull_request.number }}
      RECORD_COUNT: "200"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Authenticate to cluster
        uses: ministryofjustice/laa-reusable-github-actions/.github/actions/authenticate_to_cluster@2aa2676c3cd9876ec7037ee8b3d729d0306cb7c6
        with:
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}

      - name: Run mass generator as a job
        shell: bash
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          set -euo pipefail

          POSTGRES_SECRET="${RELEASE_NAME}-postgresql"
          JOB_NAME="${RELEASE_NAME}-mass-generator-job"

          # Retrieve the image from the existing mass generator deployment
          IMAGE=$(kubectl get deployment "${RELEASE_NAME}-mass-generator-mass-generator" \
            -n "$KUBE_NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}')

          if [ -z "$IMAGE" ]; then
            echo "Could not retrieve image from deployment ${RELEASE_NAME}-mass-generator-mass-generator" >&2
            exit 1
          fi

          echo "Using image: $IMAGE"
          echo "Running mass generator job: $JOB_NAME (count: $RECORD_COUNT)"

          # Delete any previous job with the same name to allow re-runs
          kubectl delete job "$JOB_NAME" -n "$KUBE_NAMESPACE" --ignore-not-found

          kubectl create job "$JOB_NAME" \
            --image="$IMAGE" \
            --namespace="$KUBE_NAMESPACE" \
            -- java -jar /mass-generator/mass-generator.jar "$RECORD_COUNT"

          # Patch the job to inject DB credentials from the existing postgres secret
          kubectl patch job "$JOB_NAME" -n "$KUBE_NAMESPACE" --type=json -p="[
            {\"op\": \"add\", \"path\": \"/spec/template/spec/containers/0/env\", \"value\": [
              {\"name\": \"DB_NAME\",     \"value\": \"postgres\"},
              {\"name\": \"DB_HOST\",     \"value\": \"${POSTGRES_SECRET}\"},
              {\"name\": \"DB_PASSWORD\", \"valueFrom\": {\"secretKeyRef\": {\"name\": \"${POSTGRES_SECRET}\", \"key\": \"postgres-password\"}}},
              {\"name\": \"DB_URL\",      \"value\": \"jdbc:postgresql://${POSTGRES_SECRET}:5432/postgres\"}
            ]},
            {\"op\": \"add\", \"path\": \"/spec/template/spec/containers/0/securityContext\", \"value\": {
              \"runAsNonRoot\": true,
              \"runAsUser\": 1001,
              \"runAsGroup\": 1001,
              \"allowPrivilegeEscalation\": false,
              \"seccompProfile\": {\"type\": \"RuntimeDefault\"},
              \"capabilities\": {\"drop\": [\"ALL\"]}
            }}
          ]"

          echo "Waiting for job to complete..."
          kubectl wait job "$JOB_NAME" \
            -n "$KUBE_NAMESPACE" \
            --for=condition=complete \
            --timeout=3600s

          echo "Mass generator job completed successfully"

      - name: Clean up job
        if: always()
        shell: bash
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          kubectl delete job "${RELEASE_NAME}-mass-generator-job" \
            -n "$KUBE_NAMESPACE" \
            --ignore-not-found

      # TODO: Take a pg_dump snapshot from the ephemeral PostgreSQL pod
      # The PostgreSQL release is named: ${RELEASE_NAME}-postgresql
      # Pod selector: app.kubernetes.io/instance=${RELEASE_NAME}-postgresql
      # Credentials are in the Kubernetes secret: ${RELEASE_NAME}-postgresql
      #   key: postgres-password
      # Example command:
      #   kubectl exec -n "$KUBE_NAMESPACE" "$PG_POD" -- \
      #     pg_dump -U postgres postgres > snapshot.sql

      # TODO: Export snapshot (e.g. upload to S3)
      # aws s3 cp snapshot.sql s3://your-bucket/snapshots/${RELEASE_NAME}/snapshot.sql
