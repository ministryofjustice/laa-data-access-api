name: Export generated data

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  export-generated-data:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'export-generated-data'
    environment: uat  # ephemeral environments run in the UAT cluster namespace
    permissions:
      id-token: write
      contents: read
    env:
      RELEASE_NAME: pr-${{ github.event.pull_request.number }}
      RECORD_COUNT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run deploy prerequisites
        id: deploy_prerequisites
        uses: ./.github/actions/deploy_prerequisites
        with:
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}
          ecr-role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          ecr-region: ${{ vars.ECR_REGION }}

      - name: Run mass generator
        shell: bash
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
          ECR_REGISTRY: ${{ steps.deploy_prerequisites.outputs.ecr-registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          set -euo pipefail

          HELM_RELEASE="${RELEASE_NAME}-mass-generator-job"
          JOB_NAME="${HELM_RELEASE}-job"

          # Retrieve the image tag from the existing mass generator deployment
          IMAGE_TAG=$(kubectl get deployment "${RELEASE_NAME}-mass-generator-mass-generator" \
            -n "$KUBE_NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}' \
            | cut -d: -f2)

          if [ -z "$IMAGE_TAG" ]; then
            echo "Could not retrieve image tag from deployment ${RELEASE_NAME}-mass-generator-mass-generator" >&2
            exit 1
          fi

          echo "Using image tag: $IMAGE_TAG"

          # Delete any previous job to allow re-runs
          kubectl delete job "$JOB_NAME" -n "$KUBE_NAMESPACE" --ignore-not-found

          # Deploy the mass generator job via its own isolated Helm chart
          helm upgrade "$HELM_RELEASE" .helm/mass-generator-job \
            --namespace "$KUBE_NAMESPACE" \
            --set image.repository="${ECR_REGISTRY}/${ECR_REPOSITORY}" \
            --set image.tag="${IMAGE_TAG}" \
            --set spring.profile="preview" \
            --set db.postgresqlReleaseName="${RELEASE_NAME}-postgresql" \
            --set job.recordCount="${RECORD_COUNT}" \
            --install \
            --wait

          echo "Waiting for mass generator job to complete..."
          kubectl wait job "$JOB_NAME" \
            -n "$KUBE_NAMESPACE" \
            --for=condition=complete \
            --timeout=3600s

          echo "Mass generator job completed successfully"

      - name: Run smoke tests
        uses: ./.github/actions/smoke-test
        with:
          release-name: ${{ env.RELEASE_NAME }}
          branch-name: ${{ github.head_ref }}
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          report-name: export-smoke-test-report

      - name: Take and upload pg_dump snapshot
        id: pg_dump
        shell: bash
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          set -euo pipefail

          PG_RELEASE="${RELEASE_NAME}-postgresql"

          # Retrieve the actual bucket name from the Kubernetes secret
          S3_BUCKET=$(kubectl get secret s3-bucket-output \
            -n "$KUBE_NAMESPACE" \
            -o jsonpath='{.data.bucket_name}' | base64 -d)

          if [ -z "$S3_BUCKET" ]; then
            echo "Could not retrieve bucket name from secret s3-bucket-output" >&2
            exit 1
          fi

          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
          SNAPSHOT_FILE="snapshot-${RELEASE_NAME}-${TIMESTAMP}.sql.gz"
          S3_KEY="snapshots/${RELEASE_NAME}/${TIMESTAMP}/snapshot.sql.gz"

          # Get PostgreSQL password from Kubernetes secret
          PG_PASSWORD=$(kubectl get secret "$PG_RELEASE" \
            -n "$KUBE_NAMESPACE" \
            -o jsonpath='{.data.postgres-password}' | base64 -d)
          echo "::add-mask::$PG_PASSWORD"

          # Port-forward PostgreSQL to localhost; trap ensures cleanup on exit
          PORT_FORWARD_PID=""
          cleanup() {
            [ -n "$PORT_FORWARD_PID" ] && kill "$PORT_FORWARD_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          kubectl port-forward "pod/${PG_RELEASE}-0" 5432:5432 \
            -n "$KUBE_NAMESPACE" &
          PORT_FORWARD_PID=$!

          echo "Waiting for port-forward to be ready..."
          for i in $(seq 1 15); do
            if PGPASSWORD="$PG_PASSWORD" pg_isready -h localhost -p 5432 -U postgres 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if ! PGPASSWORD="$PG_PASSWORD" pg_isready -h localhost -p 5432 -U postgres 2>/dev/null; then
            echo "Port-forward to PostgreSQL did not become ready in time" >&2
            exit 1
          fi

          echo "Running pg_dump..."
          PGPASSWORD="$PG_PASSWORD" pg_dump -U postgres -h localhost -p 5432 postgres \
            | gzip > "$SNAPSHOT_FILE"

          if [ ! -s "$SNAPSHOT_FILE" ]; then
            echo "Snapshot file is empty" >&2
            exit 1
          fi

          echo "Snapshot written: $SNAPSHOT_FILE ($(wc -c < "$SNAPSHOT_FILE") bytes)"

          echo "Uploading to s3://${S3_BUCKET}/${S3_KEY}..."
          aws s3 cp "$SNAPSHOT_FILE" "s3://${S3_BUCKET}/${S3_KEY}"

          echo "Snapshot uploaded to s3://${S3_BUCKET}/${S3_KEY}"
