name: Run mass generator

on:
  workflow_dispatch:
    inputs:
      record_count:
        description: "Number of records to generate"
        required: false
        default: "300000"
        type: string
      database:
        description: "Target database. Use 'uat' for the default UAT database, or 'other' to supply connection details below."
        required: true
        default: "uat"
        type: choice
        options:
          - uat
          - other
      # Phase 2: replace the freeform inputs below with GitHub secrets following
      # the naming convention {ENV}_DB_* and use dynamic variable indirection to
      # resolve them. The 'other' option above would be replaced with named choices.
      db_host:
        description: "[other only] Database host"
        required: false
        type: string
      db_name:
        description: "[other only] Database name"
        required: false
        type: string
      db_username:
        description: "[other only] Database username"
        required: false
        type: string
      db_password:
        description: "[other only] Database password"
        required: false
        type: string

permissions:
  contents: read

jobs:
  run-mass-generator:
    runs-on: ubuntu-latest
    environment: uat
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate inputs
        shell: bash
        env:
          DATABASE: ${{ inputs.database }}
          DB_HOST: ${{ inputs.db_host }}
          DB_NAME: ${{ inputs.db_name }}
          DB_USERNAME: ${{ inputs.db_username }}
          DB_PASSWORD: ${{ inputs.db_password }}
        run: |
          set -euo pipefail
          if [ "$DATABASE" = "other" ]; then
            missing=()
            [ -z "$DB_HOST" ]     && missing+=("db_host")
            [ -z "$DB_NAME" ]     && missing+=("db_name")
            [ -z "$DB_USERNAME" ] && missing+=("db_username")
            [ -z "$DB_PASSWORD" ] && missing+=("db_password")
            if [ ${#missing[@]} -gt 0 ]; then
              echo "The following inputs are required when database is 'other': ${missing[*]}" >&2
              exit 1
            fi
          fi

      - name: Authenticate to cluster
        uses: ministryofjustice/laa-reusable-github-actions/.github/actions/authenticate_to_cluster@2aa2676c3cd9876ec7037ee8b3d729d0306cb7c6
        with:
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}

      - name: Scale mass generator up
        shell: bash
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          kubectl scale deployment main-mass-generator-mass-generator \
            --replicas=1 \
            --namespace "$KUBE_NAMESPACE"
          kubectl rollout status deployment/main-mass-generator-mass-generator \
            --namespace "$KUBE_NAMESPACE" \
            --timeout=120s

      - name: Run mass generator
        shell: bash
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
          RECORD_COUNT: ${{ inputs.record_count }}
          DATABASE: ${{ inputs.database }}
          DB_HOST: ${{ inputs.db_host }}
          DB_NAME: ${{ inputs.db_name }}
          DB_USERNAME: ${{ inputs.db_username }}
          DB_PASSWORD: ${{ inputs.db_password }}
        run: |
          set -euo pipefail

          POD_NAME=$(kubectl get pod \
            -n "$KUBE_NAMESPACE" \
            -l "app.kubernetes.io/instance=main-mass-generator,app.kubernetes.io/name=mass-generator" \
            -o jsonpath='{.items[0].metadata.name}')

          if [ -z "$POD_NAME" ]; then
            echo "No mass generator pod found" >&2
            exit 1
          fi

          echo "Running mass generator on pod: $POD_NAME (count: $RECORD_COUNT, database: $DATABASE)"

          if [ "$DATABASE" = "other" ]; then
            echo "::add-mask::$DB_PASSWORD"
            kubectl exec -n "$KUBE_NAMESPACE" "$POD_NAME" -- \
              env "DB_URL=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}" \
                  "DB_HOST=${DB_HOST}" \
                  "DB_NAME=${DB_NAME}" \
                  "DB_USERNAME=${DB_USERNAME}" \
                  "DB_PASSWORD=${DB_PASSWORD}" \
              java -jar /mass-generator/mass-generator.jar "$RECORD_COUNT"
          else
            echo "Using pod default DB connection for uat"
            kubectl exec -n "$KUBE_NAMESPACE" "$POD_NAME" -- \
              java -jar /mass-generator/mass-generator.jar "$RECORD_COUNT"
          fi

      - name: Scale mass generator down
        if: always()
        shell: bash
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          kubectl scale deployment main-mass-generator-mass-generator \
            --replicas=0 \
            --namespace "$KUBE_NAMESPACE"
