name: "Deploy"
description: 'Deploy docker image to namespace'
inputs:
  ecr-repository:
    description: "ECR repository"
    required: true
  ecr-region:
    description: "ECR region"
    required: true
  ecr-role-to-assume:
    description: "ECR role to assume"
    required: true
  kube-cert:
    description: "Kubernetes cluster authentication certificate"
    required: true
  kube-token:
    description: "Kubernetes cluster authentication token"
    required: true
  kube-cluster:
    description: "Kubernetes cluster name"
    required: true
  kube-namespace:
    description: "Kubernetes cluster namespace"
    required: true
  app-environment:
    description: "environment to which the app is being deployed [staging, production, etc]"
    required: true
  image-tag:
    description: "Docker image tag to deploy. Defaults to the git SHA."
    required: false
    default: ${{ github.sha }}
  deploy-axon:
    description: "Whether to also deploy the Axon (CQRS) service as a separate Helm release. Defaults to false for staging/production until smoke-gated."
    required: false
    default: "false"
  axon-image-tag:
    description: "Docker image tag for the Axon service (e.g. <version>-axon). Required when deploy-axon is true."
    required: false
    default: ""

runs:
  using: "composite"
  steps:

    - name: Run deploy prerequisites
      id: deploy_prerequisites
      uses: ./.github/actions/deploy_prerequisites
      with:
        kube-cert: ${{ inputs.kube-cert }}
        kube-token: ${{ inputs.kube-token }}
        kube-cluster: ${{ inputs.kube-cluster }}
        kube-namespace: ${{ inputs.kube-namespace }}
        ecr-role-to-assume: ${{ inputs.ecr-role-to-assume }}
        ecr-region: ${{ inputs.ecr-region }}

    - name: Get LAA IP allowlist
      id: get_laa_ips
      uses: ./.github/actions/get_laa_ips

    - name: Helm deployment
      shell: bash
      env:
        ECR_REPOSITORY: ${{ inputs.ecr-repository }}
        ECR_REGION: ${{ inputs.ecr-region }}
        ECR_REGISTRY: ${{ steps.deploy_prerequisites.outputs.ecr-registry }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        KUBE_NAMESPACE: ${{ inputs.kube-namespace }}
        APP_ENVIRONMENT: ${{ inputs.app-environment }}
        VALUES_FILE: .helm/data-access-api/values/${{ inputs.app-environment }}.yaml
      run: |
        if [ -z "${IMAGE_TAG}" ]; then
          echo "image-tag input is required."
          exit 1
        fi

        LAA_IPS="${{ steps.get_laa_ips.outputs.laa-ips }}"
        echo "Environment: ${APP_ENVIRONMENT}"

        if [ "${APP_ENVIRONMENT}" = "production" ]; then
          SPRING_PROFILE="main"
        else
          SPRING_PROFILE="unsecured"
        fi

        helm upgrade laa-data-access-api .helm/data-access-api \
          --namespace ${KUBE_NAMESPACE} \
          --set image.repository="${ECR_REGISTRY}/${ECR_REPOSITORY}" \
          --set image.tag="${IMAGE_TAG}" \
          --set ingress.annotations."nginx\.ingress\.kubernetes\.io/whitelist-source-range"="$LAA_IPS" \
          --set spring.profile="${SPRING_PROFILE}" \
          --set aws.region="${ECR_REGION}" \
          --set massGenerator.image.repository="${ECR_REGISTRY}/${ECR_REPOSITORY}" \
          --set massGenerator.image.tag="${IMAGE_TAG}-mass-generator" \
          --values ${VALUES_FILE} \
          --install \
          --wait

    # TODO(axon-smoke-gate): enable deploy-axon for staging/production only once
    # Axon-specific smoke tests exist and pass.
    - name: Verify Axon image exists
      if: ${{ inputs.deploy-axon == 'true' }}
      shell: bash
      env:
        ECR_REPOSITORY: ${{ inputs.ecr-repository }}
        ECR_REGION: ${{ inputs.ecr-region }}
        AXON_IMAGE_TAG: ${{ inputs.axon-image-tag }}
      run: |
        set -euo pipefail
        if [ -z "${AXON_IMAGE_TAG}" ]; then
          echo "[axon] axon-image-tag input is required when deploy-axon is true."
          exit 1
        fi
        echo "[axon] Verifying image ${ECR_REPOSITORY}:${AXON_IMAGE_TAG} exists in ECR..."
        aws ecr describe-images \
          --repository-name "${ECR_REPOSITORY}" \
          --image-ids imageTag="${AXON_IMAGE_TAG}" \
          --region "${ECR_REGION}" >/dev/null

    - name: Helm deployment of Axon service
      if: ${{ inputs.deploy-axon == 'true' }}
      shell: bash
      env:
        ECR_REPOSITORY: ${{ inputs.ecr-repository }}
        ECR_REGION: ${{ inputs.ecr-region }}
        ECR_REGISTRY: ${{ steps.deploy_prerequisites.outputs.ecr-registry }}
        AXON_IMAGE_TAG: ${{ inputs.axon-image-tag }}
        KUBE_NAMESPACE: ${{ inputs.kube-namespace }}
        APP_ENVIRONMENT: ${{ inputs.app-environment }}
        VALUES_FILE: .helm/data-access-api-axon/values/${{ inputs.app-environment }}.yaml
      run: |
        set -euo pipefail

        axon_host="laa-data-access-api-axon-${KUBE_NAMESPACE}.cloud-platform.service.justice.gov.uk"
        echo "[axon] Deploying image tag: ${AXON_IMAGE_TAG} to ${axon_host}..."

        if ! helm upgrade laa-data-access-api-axon .helm/data-access-api-axon \
          --namespace "${KUBE_NAMESPACE}" \
          --set image.repository="${ECR_REGISTRY}/${ECR_REPOSITORY}" \
          --set image.tag="${AXON_IMAGE_TAG}" \
          --set ingress.hosts="{${axon_host}}" \
          --set spring.profile="${APP_ENVIRONMENT}" \
          --set aws.region="${ECR_REGION}" \
          --values "${VALUES_FILE}" \
          --install \
          --wait; then
          echo "[axon] Helm deployment failed for release laa-data-access-api-axon."
          exit 1
        fi

