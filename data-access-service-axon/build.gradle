import org.gradle.api.tasks.testing.logging.TestLogEvent

plugins {
    id 'java'
    id 'jacoco'
    id 'checkstyle'
    id 'uk.gov.justice.service.laa.laa-spring-boot-gradle-plugin'
}

def versions = [
        sentry                  : '8.55.0',
        axonFramework           : '5.2.0',
        jsonSchemaValidator     : '3.0.0',
        swaggerAnnotations      : '2.2.43',
        springdocOpenapi        : '3.0.2',
        springCloudAws          : '4.0.2',
        awsSdkSts               : '2.33.7',
        lombok                  : '1.18.46',
        datafaker               : '2.5.2',
        archunit                : '1.4.2',
        testcontainers          : '2.0.5',
        micrometerSpringBoot    : '2.2.0',
        logbackEcsEncoder       : '1.6.0'
]

sourceSets {
    testUtilities {
        java.srcDir 'src/testUtilities/java'
        resources.srcDir 'src/testUtilities/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    test {
        compileClasspath += sourceSets.testUtilities.output
        runtimeClasspath += sourceSets.testUtilities.output
    }
    integrationTest {
        compileClasspath += sourceSets.testUtilities.output
        runtimeClasspath += sourceSets.testUtilities.output
    }
    pactTest {
        compileClasspath += sourceSets.main.output + sourceSets.testUtilities.output
        runtimeClasspath += sourceSets.main.output + sourceSets.testUtilities.output
    }
}

configurations {
    testUtilitiesImplementation.extendsFrom testImplementation
    testUtilitiesRuntimeOnly.extendsFrom testRuntimeOnly
    pactTestImplementation.extendsFrom testImplementation
    pactTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation(project(':data-access-api')) {
        transitive = false
    }
    implementation project(':data-access-shared')

    implementation 'io.projectreactor:reactor-core'
    implementation "org.axonframework.extensions.spring:axon-spring-boot-starter:$versions.axonFramework"
    implementation "com.networknt:json-schema-validator:$versions.jsonSchemaValidator"
    implementation "io.swagger.core.v3:swagger-annotations-jakarta:$versions.swaggerAnnotations"
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.security:spring-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'uk.gov.justice.service.laa:laa-spring-boot-starter-oauth2'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    implementation "net.ttddyy.observation:datasource-micrometer-spring-boot:$versions.micrometerSpringBoot"

    implementation("org.springdoc:springdoc-openapi-starter-webmvc-ui:$versions.springdocOpenapi") {
        exclude group: 'tools.jackson.core'
    }
    implementation 'org.flywaydb:flyway-database-postgresql'
    // Match the Cloud Platform IRSA/default-credentials pattern.
    implementation platform("io.awspring.cloud:spring-cloud-aws:$versions.springCloudAws")
    implementation 'io.awspring.cloud:spring-cloud-aws-starter'
    implementation 'software.amazon.awssdk:sns'
    implementation "software.amazon.awssdk:sts:$versions.awsSdkSts"
    compileOnly "org.projectlombok:lombok:$versions.lombok"
    annotationProcessor "org.projectlombok:lombok:$versions.lombok"
    runtimeOnly 'org.postgresql:postgresql'
    implementation "net.datafaker:datafaker:$versions.datafaker"

    // Sentry
    implementation platform("io.sentry:sentry-bom:$versions.sentry")
    implementation "io.sentry:sentry-logback:$versions.sentry"
    implementation "io.sentry:sentry-spring-boot-4:$versions.sentry"

    // Structured Logging - ECS format
    implementation 'ch.qos.logback:logback-core'
    implementation 'ch.qos.logback:logback-classic'
    implementation "co.elastic.logging:logback-ecs-encoder:$versions.logbackEcsEncoder"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient'
    testImplementation "org.axonframework:axon-test:$versions.axonFramework"
    testImplementation "com.tngtech.archunit:archunit-junit5:$versions.archunit"
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    integrationTestImplementation 'org.springframework.boot:spring-boot-starter-test'
    integrationTestImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    integrationTestImplementation 'org.springframework.boot:spring-boot-starter-restclient'
    integrationTestImplementation 'org.springframework.boot:spring-boot-testcontainers'
    integrationTestImplementation "org.testcontainers:testcontainers-junit-jupiter:$versions.testcontainers"
    integrationTestImplementation "org.testcontainers:testcontainers-postgresql:$versions.testcontainers"
    integrationTestImplementation 'software.amazon.awssdk:sqs'

    // Pact provider verification runs in the dedicated `pactTest` source set against the real
    // application on in-memory H2. Only the broker client and HTTP replay support are extra.
    pactTestImplementation 'au.com.dius.pact.provider:spring7:4.7.0-beta.3'
    pactTestImplementation 'org.springframework.boot:spring-boot-starter-test'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

tasks.named('integrationTest') {
    dependsOn tasks.named('testUtilitiesClasses')
    useJUnitPlatform()
    exclude 'uk/gov/justice/laa/dstew/access/GenerateAxonMassDataDumpTest.class'
    jacoco {
        destinationFile = layout.buildDirectory.file("jacoco/integrationTest.exec").get().asFile
    }
}

tasks.register('pactTest', Test) {
    description = 'Runs Pact provider verification against consumer contracts pulled from the broker.'
    group = 'verification'
    dependsOn tasks.named('testUtilitiesClasses')
    useJUnitPlatform()

    testClassesDirs = sourceSets.pactTest.output.classesDirs
    classpath = sourceSets.pactTest.runtimeClasspath
    exclude 'uk/gov/justice/laa/dstew/access/pact/PactProviderBootCheckTest.class'

    // Publish verification results back to the broker only when broker credentials are present.
    // Set PACT_PUBLISH_RESULTS=false for a local diagnostic run that must not record a result.
    def canPublish =
            providers.environmentVariable('PACT_BROKER_USERNAME').isPresent() &&
            providers.environmentVariable('PACT_BROKER_PASSWORD').isPresent() &&
            providers.environmentVariable('PACT_PUBLISH_RESULTS').getOrElse('true') != 'false'
    if (canPublish) {
        systemProperty 'pact.verifier.publishResults', 'true'
    }

    // Provider version and branch are recorded with the published results so the broker's
    // can-i-deploy and webhook triggers resolve against the provider's main branch. The shared
    // LAA workflows export the branch as GIT_BRANCH; GITHUB_REF_NAME covers other Actions runs.
    systemProperty 'pact.provider.version', providers.environmentVariable('GIT_SHA').getOrElse('1.0.0')
    def providerBranch = providers.environmentVariable('PACT_PROVIDER_BRANCH')
            .orElse(providers.environmentVariable('GIT_BRANCH'))
            .orElse(providers.environmentVariable('GITHUB_REF_NAME'))
            .orNull
    if (providerBranch) {
        systemProperty 'pact.provider.branch', providerBranch
        systemProperty 'pactbroker.providerBranch', providerBranch
    }

    // Pending pacts: a consumer's brand-new or changed pact must not turn this provider's build red
    // until it has been verified successfully once. The broker reports it as pending instead.
    // Work-in-progress pacts from consumer feature branches are verified too, without failing.
    // PACT_WIP_PACTS_SINCE (a repository variable, passed through as an env var) overrides the
    // cutoff date without a source change.
    systemProperty 'pactbroker.enablePending', 'true'
    systemProperty 'pactbroker.includeWipPactsSince',
            providers.environmentVariable('PACT_WIP_PACTS_SINCE').getOrElse('2026-10-01')

    // Broker connection is env-driven, with placeholders so the task still configures locally.
    systemProperty 'pactbroker.url', providers.environmentVariable('PACT_BROKER_URL').getOrElse('https://laa-data-pact-broker.apps.live.cloud-platform.service.justice.gov.uk/')
    systemProperty 'pactbroker.auth.username', providers.environmentVariable('PACT_BROKER_USERNAME').getOrElse('ABC')
    systemProperty 'pactbroker.auth.password', providers.environmentVariable('PACT_BROKER_PASSWORD').getOrElse('ABC')

    // Consumer-version selectors. The webhook names one consumer and branch, so verify exactly that
    // pact. Otherwise (main builds, local runs) verify what each consumer has on its main branch and
    // whatever is currently deployed or released, which is Pact's recommended default.
    def consumerName = providers.environmentVariable('PACT_CONSUMER_NAME').orNull
    if (consumerName) {
        systemProperty 'pact.filter.consumers', consumerName
    }
    def consumerBranch = providers.environmentVariable('PACT_CONSUMER_BRANCH').orNull
    def selectors = consumerBranch
            ? "[{\"branch\":\"${consumerBranch}\"}]"
            : '[{"mainBranch":true},{"deployedOrReleased":true}]'
    systemProperty 'pactbroker.consumerversionselectors.rawjson', selectors

    systemProperty 'pact.rootDir', layout.buildDirectory.dir("pacts").get().asFile.path

    testLogging {
        events TestLogEvent.PASSED, TestLogEvent.SKIPPED, TestLogEvent.FAILED
        exceptionFormat = 'full'
    }
}

// Runs on every build without the broker: boots the Pact provider context on in-memory H2 and
// exercises every provider state handler, so a renamed use case, a broken profile or a seeding
// helper that no longer matches the domain rules fails the pull request rather than the next
// consumer-triggered verification.
tasks.register('pactBootCheck', Test) {
    description = 'Boots the Pact provider test context and runs every provider state, without the broker.'
    group = 'verification'
    dependsOn tasks.named('testUtilitiesClasses')
    useJUnitPlatform()
    testClassesDirs = sourceSets.pactTest.output.classesDirs
    classpath = sourceSets.pactTest.runtimeClasspath
    include 'uk/gov/justice/laa/dstew/access/pact/PactProviderBootCheckTest.class'
}

tasks.named('check') {
    dependsOn tasks.named('pactBootCheck')
}

tasks.register('generateAxonMassDataDump', Test) {
    dependsOn tasks.named('integrationTestClasses')
    dependsOn tasks.named('testUtilitiesClasses')
    description = 'Generates an Axon mass-data PostgreSQL dump using a disposable Testcontainer.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    include 'uk/gov/justice/laa/dstew/access/GenerateAxonMassDataDumpTest.class'
    testLogging {
        events TestLogEvent.PASSED, TestLogEvent.SKIPPED, TestLogEvent.FAILED
        exceptionFormat = 'full'
        showExceptions = true
        showCauses = true
        showStackTraces = true
        showStandardStreams = true
    }
    ['massDataCount', 'massDataMaxWorkers', 'massDataSeed', 'massDataDump', 'massDataProgressInterval'].each {
        if (project.hasProperty(it)) {
            systemProperty it, project.property(it)
        }
    }
}

jacoco {
    toolVersion = "0.8.13"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/DataAccessServiceAxonApplication.class', '**/generated/**', '**/*Generated*.*', '**/*_.class'])
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn integrationTest

    executionData(
        layout.buildDirectory.file("jacoco/test.exec"),
        layout.buildDirectory.file("jacoco/integrationTest.exec")
    )

    afterEvaluate {
        classDirectories.setFrom(files(sourceSets.main.output.classesDirs.collect {
            fileTree(dir: it, exclude: ['**/DataAccessServiceAxonApplication.class', '**/generated/**', '**/*Generated*.*', '**/*_.class'])
        }))
    }

    violationRules {
        failOnViolation = true

        rule {
            element = 'CLASS'
            limit {
                counter = 'LINE'
                minimum = 0.9
            }
            limit {
                counter = 'BRANCH'
                minimum = 0.9
            }
        }
    }
}

spotlessApply.mustRunAfter clean
build.mustRunAfter spotlessApply
tasks.named('integrationTest').configure { mustRunAfter build }
jacocoTestCoverageVerification.mustRunAfter tasks.named('integrationTest')

tasks.register('preflightCheck') {
    description = 'Runs clean, spotlessApply, build, integrationTest and jacocoTestCoverageVerification'
    group = 'verification'
    dependsOn clean, spotlessApply, build, tasks.named('integrationTest'), jacocoTestCoverageVerification, combinedCoverageReport
}

tasks.register('combinedCoverageReport', JacocoReport) {
    description = 'Generates a combined JaCoCo coverage report for unit tests and integration tests'
    group = 'verification'
    dependsOn test, tasks.named('integrationTest')

    executionData(
        layout.buildDirectory.file('jacoco/test.exec'),
        layout.buildDirectory.file('jacoco/integrationTest.exec')
    )

    sourceDirectories.from(sourceSets.main.allJava.srcDirs)
    classDirectories.from(files(sourceSets.main.output.classesDirs).asFileTree.matching {
        exclude '**/DataAccessServiceAxonApplication.class', '**/generated/**', '**/*Generated*.*', '**/*_.class'
    })

    reports {
        xml.required = true
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/combined/combined.xml')
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/combined/html')
        csv.required = false
    }

    doLast {
        logger.lifecycle("Combined coverage report written to: ${reports.html.outputLocation.get().asFile.toURI()}")
    }
}
