server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: data-access-service-axon
  autoconfigure:
    exclude: org.axonframework.springboot.autoconfig.XStreamAutoConfiguration
  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/laa_data_access_api?currentSchema=${AXON_DB_SCHEMA:axon}}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:laa_user}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:laa_password}}
  jpa:
    database-platform: uk.gov.justice.laa.dstew.access.config.ByteaEnforcedPostgresSqlDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${AXON_DB_SCHEMA:axon}
  sql:
    init:
      mode: never # Use Flyway for DB schema.
  cloud:
    aws:
      region: ${AWS_REGION}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ENTRA_ISSUER_URI}

axon:
  axonserver:
    enabled: false
  converter:
    general: jackson
    events: jackson
    messages: jackson
  db:
    # Schema and Flyway history table are env-overridable so Helm-injected values
    # (e.g. data_access_axon / flyway_schema_history_axon) take effect at runtime.
    schema: ${AXON_DB_SCHEMA:axon}
    flyway-table: ${AXON_FLYWAY_TABLE:flyway_schema_history}

application:
  projection:
    timeout: 5s

laa:
  springboot:
    starter:
      oauth2:
        resourceserver:
          jwt:
            tenants:
              - issuer-uri: ${ENTRA_ISSUER_URI}
                audiences:
                  - ${ENTRA_AUD}
        authorized-roles: '[{"name": "LAA_CASEWORKER", "uris": ["/api/**"]}]'
        unprotected-uris:
          - /actuator/health
          - /actuator/info
          - /actuator/prometheus
          - /actuator/metrics/**
          - /swagger-ui/**
          - /v3/api-docs/**

logging:
  level:
    com.azure.spring: INFO

management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.show-details: always
  info.env.enabled: true

springdoc:
  api-docs:
    version: openapi_3_1

feature:
  disable-security: ${FEATURE_DISABLE_SECURITY:false}
