server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: data-access-service-axon
  autoconfigure:
    exclude: org.axonframework.springboot.autoconfig.XStreamAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/laa_data_access_api?currentSchema=${AXON_DB_SCHEMA:axon}}
    username: ${SPRING_DATASOURCE_USERNAME:laa_user}
    password: ${SPRING_DATASOURCE_PASSWORD:laa_password}
  jpa:
    database-platform: uk.gov.justice.laa.dstew.access.config.ByteaEnforcedPostgresSqlDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${AXON_DB_SCHEMA:axon}

axon:
  axonserver:
    enabled: false
  converter:
    general: jackson
    events: jackson
    messages: jackson
  db:
    # Schema and Flyway history table are env-overridable so Helm-injected values
    # (e.g. data_access_axon / flyway_schema_history_axon) take effect at runtime.
    schema: ${AXON_DB_SCHEMA:axon}
    flyway-table: ${AXON_FLYWAY_TABLE:flyway_schema_history}

application:
  projection:
    timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    version: openapi_3_1
