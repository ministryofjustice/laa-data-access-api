apiVersion: v1
kind: Service
metadata:
  name: {{ include "data-access-api-axon.fullname" . }}
  labels:
    {{- include "data-access-api-axon.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "data-access-api-axon.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: axon

