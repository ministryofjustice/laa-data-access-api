apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "data-access-api-axon.fullname" . }}
  labels:
    {{- include "data-access-api-axon.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 100%
  selector:
    matchLabels:
      {{- include "data-access-api-axon.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "data-access-api-axon.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: axon
      annotations:
        releaseTime: {{ dateInZone "2006-01-02 15:04:05Z" (now) "UTC"| quote }}
    spec:
      serviceAccountName: "{{ .Values.service_account.name }}"
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ "ALL" ]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            {{ include "axonDbConnectionDetails" . | nindent 12 }}
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.spring.profile | quote }}
            - name: AWS_REGION
              value: {{ .Values.aws.region | quote }}
            {{ include "axonFeatureConfig" . | nindent 12 }}
            {{ include "axonOauth2Config" . | nindent 12 }}
            {{ include "axonSdsApiConfig" . | nindent 12 }}
            {{- if .Values.aws.integrationEvents.enabled }}
            - name: APPLICATION_INTEGRATION_EVENTS_TOPIC_ARN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aws.topicArnSecret.name | quote }}
                  key: {{ .Values.aws.topicArnSecret.key | quote }}
            {{- end }}
            {{ include "axonSentryConfig" . | nindent 12 }}
            - name: METRICS_RELEASE_TAG
              value: "{{ .Release.Name }}"
