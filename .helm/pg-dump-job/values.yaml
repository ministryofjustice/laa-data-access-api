pgDump:
  image:
    repository: null  # set dynamically from the PostgreSQL StatefulSet at runtime
    tag: null

awsUpload:
  image:
    repository: public.ecr.aws/aws-cli/aws-cli
    tag: "2.17.0"
  s3:
    bucket: null
    prefix: null  # e.g. snapshots/pr-459 — set by workflow

db:
  host: null
  secretName: null

resources:
  pgDump:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 25m
      memory: 128Mi
  awsUpload:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 25m
      memory: 128Mi
