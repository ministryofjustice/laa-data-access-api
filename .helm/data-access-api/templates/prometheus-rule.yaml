{{/*
  Guard: only create this PrometheusRule for persistent environments (UAT, Staging, Production),
  plus ephemeral PR previews while we trial this alert (TEMPORARY — remove the "pr-" prefix check
  below once the trial is done, so ephemeral environments go back to being excluded).

  Ephemeral PR previews and RC feature environments share the same values file and namespace as
  persistent UAT, so the release name is the only way to tell them apart:
    - "main"                -> persistent UAT          (keep)
    - "laa-data-access-api" -> Staging or Production    (keep)
    - "pr-<number>"         -> ephemeral PR preview      (temporarily included for the trial)
    - "feat-env-<sha>"      -> RC feature environment    (still excluded)

  Update this allow-list if the CI release-naming convention ever changes.
*/}}
{{- if or (eq .Release.Name "main") (eq .Release.Name "laa-data-access-api") (hasPrefix "pr-" .Release.Name) }}
{{- $severity := "laa-data-stewardship-access-nonprod" }}
{{- if eq .Values.alerting.environment "production" }}
{{- $severity = "laa-data-stewardship-access-prod" }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}-alert-rules
  namespace: {{ .Release.Namespace }}
  labels:
    role: alert-rules
spec:
  groups:
    - name: data-access-api-endpoint-performance
      rules:
        - alert: DataAccessApiHttpLatencyP95Warning
          expr: >-
            histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{namespace="{{ .Release.Namespace }}",release="{{ .Release.Name }}"}[5m]))) > 0
          for: 1m
          labels:
            severity: {{ $severity }}
          annotations:
            message: >-
              95th percentile HTTP latency for {{ .Release.Name }} in {{ .Release.Namespace }} is
              {{`{{ $value }}`}}s.
{{- end }}
