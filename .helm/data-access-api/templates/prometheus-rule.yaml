{{/*
  Alerting is enabled only in persistent environments (UAT, Staging,
  and Production). Ephemeral PR preview and RC feature environments are excluded.
*/}}
{{- if or (eq .Release.Name "main") (eq .Release.Name "laa-data-access-api") }}
{{- $severity := "laa-data-stewardship-access-nonprod" }}
{{- if eq .Values.alerting.environment "production" }}
{{- $severity = "laa-data-stewardship-access-prod" }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}-alert-rules
  namespace: {{ .Release.Namespace }}
  labels:
    role: alert-rules
spec:
  groups:
    - name: data-access-api-endpoint-performance
      rules:
        - alert: DataAccessApiHttpLatencyP95Warning
          expr: >-
            histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{namespace="{{ .Release.Namespace }}",release="{{ .Release.Name }}"}[5m]))) > 1
          for: 5m
          labels:
            severity: {{ $severity }}
          annotations:
            message: >-
              95th percentile HTTP latency for {{ .Release.Name }} in {{ .Release.Namespace }} is
              {{`{{ $value }}`}}s.
        - alert: DataAccessApiHttpLatencyP95Critical
          expr: >-
            histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{namespace="{{ .Release.Namespace }}",release="{{ .Release.Name }}"}[5m]))) > 3
          for: 2m
          labels:
            severity: {{ $severity }}
          annotations:
            message: >-
              95th percentile HTTP latency for {{ .Release.Name }} in {{ .Release.Namespace }} is
              {{`{{ $value }}`}}s (critical threshold exceeded).
        - alert: DataAccessApiHttp5xxErrorRateWarning
          expr: >-
            sum(rate(http_server_requests_seconds_count{namespace="{{ .Release.Namespace }}",release="{{ .Release.Name }}",status=~"5.."}[5m]))
            /
            sum(rate(http_server_requests_seconds_count{namespace="{{ .Release.Namespace }}",release="{{ .Release.Name }}"}[5m])) > 0.05
          for: 5m
          labels:
            severity: {{ $severity }}
          annotations:
            message: >-
              5xx error rate for {{ .Release.Name }} in {{ .Release.Namespace }} is
              {{`{{ $value | humanizePercentage }}`}}.
        - alert: DataAccessApiSqlQueryLatencyP95Warning
          expr: >-
            histogram_quantile(0.95, sum by (le) (rate(jdbc_query_seconds_bucket{namespace="{{ .Release.Namespace }}",release="{{ .Release.Name }}"}[5m]))) > {{ .Values.slowQueryThresholdSeconds }}
          for: 5m
          labels:
            severity: {{ $severity }}
          annotations:
            message: >-
              95th percentile SQL query latency for {{ .Release.Name }} in {{ .Release.Namespace }} is
              {{`{{ $value }}`}}s (slow query threshold: {{ .Values.slowQueryThresholdSeconds }}s).
{{- end }}
