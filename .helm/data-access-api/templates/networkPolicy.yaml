apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}-allow-prometheus-scraping
  namespace: {{ .Release.Namespace }}
spec:
  {{- if and .Values.smokeTest .Values.smokeTest.enabled }}
  podSelector:
    matchLabels:
      {{- include "data-access-api.selectorLabels" . | nindent 6 }}
  {{- else }}
  podSelector: {}
  {{- end }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              component: monitoring
