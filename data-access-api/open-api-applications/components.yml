components:
  schemas:
    ApplicationSortBy:
      type: string
      enum:
        - LAST_UPDATED_DATE
        - SUBMITTED_DATE

    ApplicationOrderBy:
      type: string
      enum:
        - ASC
        - DESC

    AutoGranted:
      type: string
      description: The current automatic-assessment state of the Application
      enum:
        - PENDING
        - AUTOGRANTED
        - MANUAL

    DecisionStatusResponse:
      type: string
      description: >-
        Overall decision on the application. PENDING until a decision is made. Response-only;
        command requests use DecisionStatus.
      enum:
        - PENDING
        - GRANTED
        - REFUSED

    ApplicationDocumentType:
      type: string
      enum:
        - GATEWAY_EVIDENCE
        - MERITS_REPORT
        - STATEMENT_OF_CASE
        - COURT_APPLICATION
        - COURT_ORDER
        - EXPERT_REPORT
        - COURT_APPLICATION_OR_ORDER
        - PARENTAL_RESPONSIBILITY
        - LOCAL_AUTHORITY_ASSESSMENT
        - GROUNDS_OF_APPEAL
        - COUNSEL_OPINION
        - JUDGEMENT
        - PLF_COURT_ORDER
        - LETTER_OF_INSTRUCTION
        - ESTIMATE_OF_COSTS
        - ALTERNATIVE_QUOTE
        - OTHER_PARTY_CERTIFICATE_REFERENCE
        - OTHER_SUPPORTING_DOCUMENT
        - PRIMARY_QUOTE
        - ADDITIONAL_QUOTE

    ClientResponse:
      type: object
      required:
        - firstName
        - lastName
        - dateOfBirth
        - appliedPreviously
        - addresses
      properties:
        firstName:
          type: string
          description: Client first name
        lastName:
          type: string
          description: Client last name
        lastNameAtBirth:
          type: string
          nullable: true
          description: Client last name at birth
        dateOfBirth:
          type: string
          format: date
          description: Client date of birth
        hasNationalInsuranceNumber:
          type: boolean
          nullable: true
          description: Whether the client has a National Insurance number
        nationalInsuranceNumber:
          type: string
          nullable: true
          description: Client National Insurance number
        appliedPreviously:
          type: boolean
          description: Whether the client has applied previously
        previousApplicationId:
          type: string
          nullable: true
          description: Reference to the previous application
        relationshipToInvolvedChildren:
          type: string
          nullable: true
          description: Client relationship to involved children
        addresses:
          type: array
          minItems: 1
          description: Client correspondence address history
          items:
            $ref: "#/components/schemas/AddressResponse"

    AddressResponse:
      type: object
      required:
        - location
        - postcode
        - countryCode
        - countryName
      properties:
        addressLineOne:
          type: string
          description: First line of the address
        addressLineTwo:
          type: string
          description: Second line of the address
        addressLineThree:
          type: string
          nullable: true
          description: Third line of the address
        city:
          type: string
          description: Town or city
        county:
          type: string
          description: County
        postcode:
          type: string
          description: Postcode
        organisation:
          type: string
          nullable: true
          description: Organisation name for the address
        buildingNumberName:
          type: string
          description: Building number or name
        countryCode:
          type: string
          description: ISO country code
        countryName:
          type: string
          description: Country name
        location:
          type: string
          description: Address location type
        lookupUsed:
          type: boolean
          description: Indicates if address lookup was used
        careOf:
          type: string
          nullable: true
          description: Care-of type
        careOfFirstName:
          type: string
          nullable: true
          description: Care-of first name
        careOfLastName:
          type: string
          nullable: true
          description: Care-of last name
        careOfOrganisationName:
          type: string
          nullable: true
          description: Care-of organisation name
    OpponentResponse:
      type: object
      required:
        - opponentType
      properties:
        opponentType:
          type: string
          description: Opponent type
        firstName:
          type: string
          nullable: true
          description: Opponent first name
        lastName:
          type: string
          nullable: true
          description: Opponent last name
        organisationName:
          type: string
          nullable: true
          description: Opponent organisation name

    ApplicationResponse:
      type: object
      required:
        - applicationId
        - status
        - laaReference
        - createdAt
        - lastUpdated
        - submittedAt
        - isLead
        - usedDelegatedFunctions
        - autoGranted
        - decisionStatus
        - client
        - opponents
        - proceedings
        - provider
        - priorAuthorities
        - uploadedDocuments
        - linkedApplications
        - version
      properties:
        applicationId:
          type: string
          format: uuid
          description: Unique identifier for the application
        status:
          $ref: "../open-api-common/components.yml#/components/schemas/ApplicationStatus"
        laaReference:
          type: string
          description: LAA reference for the application
        createdAt:
          type: string
          format: date-time
          description: >-
            Timestamp when the application was started in this service, either when the draft was
            started or, for applications created directly, when they were created
        lastUpdated:
          type: string
          format: date-time
          description: Timestamp when the application was last modified
        assignedTo:
          type: string
          format: uuid
          nullable: true
          description: Caseworker the application is assigned to, null when unassigned
        submittedAt:
          type: string
          format: date-time
          description: Timestamp when the application was submitted to this service
        isLead:
          type: boolean
          description: Whether this application is the lead of its linked application group
        usedDelegatedFunctions:
          type: boolean
          description: Whether delegated functions were used on any proceeding
        autoGranted:
          $ref: "#/components/schemas/AutoGranted"
        decisionStatus:
          $ref: "#/components/schemas/DecisionStatusResponse"
        client:
          $ref: "#/components/schemas/ClientResponse"
        opponents:
          type: array
          description: Opponents associated with the application, empty when there are none
          items:
            $ref: "#/components/schemas/OpponentResponse"
        proceedings:
          type: array
          minItems: 1
          description: Proceedings associated with the application
          items:
            $ref: "#/components/schemas/ApplicationProceedingResponse"
        provider:
          $ref: "#/components/schemas/ProviderResponse"
        priorAuthorities:
          type: array
          description: Prior authorities raised against the application
          items:
            $ref: "#/components/schemas/PriorAuthoritySummary"
        uploadedDocuments:
          type: array
          description: Documents uploaded to the application, excluding deleted documents
          items:
            $ref: "#/components/schemas/ApplicationDocumentResponse"
        linkedGroupVersion:
          type: string
          description: >-
            Opaque token identifying the application's linked group and its current version;
            absent when the application is not linked. Pass it back unchanged on link, unlink,
            and make-lead requests. Do not parse it.
        linkedApplications:
          type: array
          description: Other applications in the same linked application group
          items:
            $ref: "#/components/schemas/LinkedApplicationSummaryResponse"
        version:
          type: integer
          format: int64
          description: Current application version, used for concurrency control on commands
        potentialDuplicates:
          type: array
          description: List of potential duplicate applications
          items:
            $ref: "#/components/schemas/PotentialDuplicate"

    ProviderResponse:
      type: object
      required:
        - officeCode
        - contactEmail
      properties:
        officeCode:
          type: string
          description: Provider office code
        contactEmail:
          type: string
          format: email
          description: Provider contact email

    PotentialDuplicate:
      type: object
      description: Reference to a potential duplicate application
      required:
        - laaReference
      properties:
        applicationId:
          type: string
          format: uuid
          description: The application ID of the potential duplicate application
        laaReference:
          type: string
          description: The LAA reference of the potential duplicate application
        legacyReference:
          type: string
          description: The legacy reference of the potential duplicate application

    ApplicationCreateRequest:
      type: object
      required:
        - id
        - status
        - applicationContent
        - laaReference
      properties:
        id:
          type: string
          format: uuid
          description: The unique reference used to identify the application.
        status:
          $ref: "../open-api-common/components.yml#/components/schemas/ApplicationStatus"
        applicationContent:
          type: object
          description: Application data to create
          additionalProperties: true
          minProperties: 1
        laaReference:
          type: string
          minLength: 1
        potentialDuplicates:
          type: array
          description: List of potential duplicate applications
          items:
            $ref: "#/components/schemas/PotentialDuplicate"

    ApplicationUpdateRequest:
      type: object
      required:
        - applicationContent
      properties:
        status:
          $ref: "../open-api-common/components.yml#/components/schemas/ApplicationStatus"
        applicationContent:
          type: object
          description: Application data to update
          additionalProperties: true
          minProperties: 1

    SaveApplicationDraftRequest:
      type: object
      required:
        - status
        - applicationContent
        - laaReference
      properties:
        status:
          $ref: "../open-api-common/components.yml#/components/schemas/ApplicationStatus"
        applicationContent:
          type: object
          description: Application data accumulated so far on the draft
          additionalProperties: true
          minProperties: 1
        laaReference:
          type: string
          minLength: 1
        potentialDuplicates:
          type: array
          description: List of potential duplicate applications
          items:
            $ref: "#/components/schemas/PotentialDuplicate"

    CreateApplicationDraftRequest:
      allOf:
        - type: object
          required:
            - id
          properties:
            id:
              type: string
              format: uuid
              description: The unique reference used to identify the application.
        - $ref: "#/components/schemas/SaveApplicationDraftRequest"

    SaveApplicationDraftResponse:
      type: object
      required:
        - applicationId
        - savedAt
      properties:
        applicationId:
          type: string
          format: uuid
        savedAt:
          type: string
          format: date-time

    SubmitApplicationDraftResponse:
      type: object
      required:
        - applicationId
        - submittedAt
      properties:
        applicationId:
          type: string
          format: uuid
        submittedAt:
          type: string
          format: date-time

    ApplicationLinkType:
      type: string
      enum:
        - FAMILY

    ApplicationLinkRequest:
      type: object
      additionalProperties: false
      required:
        - applicationId
        - linkType
      properties:
        applicationId:
          type: string
          format: uuid
          description: Target Application whose group the source Application should join
        linkType:
          $ref: "#/components/schemas/ApplicationLinkType"
        linkedGroupVersion:
          type: string
          description: >-
            The target Application's linkedGroupVersion token exactly as last read; omit when the
            target is not linked

    LinkedGroupChangeRequest:
      type: object
      additionalProperties: false
      required: [linkedGroupVersion]
      properties:
        linkedGroupVersion:
          type: string
          description: >-
            The application's linkedGroupVersion token exactly as last read, used for concurrency
            control

    ApplicationSummary:
      type: object
      description: Summary of an application for the application list
      required:
        - applicationId
        - status
        - laaReference
        - submittedAt
        - lastUpdated
        - usedDelegatedFunctions
        - categoryOfLaw
        - categoryOfLawCode
        - matterType
        - matterTypeCode
        - autoGranted
        - clientFirstName
        - clientLastName
        - clientDateOfBirth
        - officeCode
        - isLead
        - priorAuthorities
        - linkedApplications
      properties:
        applicationId:
          type: string
          format: uuid
          description: Unique identifier for the application
        status:
          $ref: "../open-api-common/components.yml#/components/schemas/ApplicationStatus"
        laaReference:
          type: string
          description: LAA reference for the application
        submittedAt:
          type: string
          format: date-time
          description: Timestamp when the application was submitted to this service
        lastUpdated:
          type: string
          format: date-time
          description: Timestamp when the application was last modified
        usedDelegatedFunctions:
          type: boolean
          description: Whether delegated functions were used on any proceeding
        categoryOfLaw:
          type: string
          description: Category of law from the lead proceeding
        categoryOfLawCode:
          type: string
          description: Category of law code from the lead proceeding
        matterType:
          type: string
          description: Matter type from the lead proceeding
        matterTypeCode:
          type: string
          description: Matter type code from the lead proceeding
        assignedTo:
          type: string
          format: uuid
          nullable: true
          description: Caseworker the application is assigned to, null when unassigned
        autoGranted:
          $ref: "#/components/schemas/AutoGranted"
        clientFirstName:
          type: string
          description: Client first name
        clientLastName:
          type: string
          description: Client last name
        clientDateOfBirth:
          type: string
          format: date
          description: Client date of birth
        officeCode:
          type: string
          description: Provider office code
        isLead:
          type: boolean
          description: Whether this application is the lead of its linked application group
        linkedApplications:
          type: array
          description: >-
            Other applications in the same linked application group. Uses the shared
            LinkedApplicationSummaryResponse schema defined in the getApplicationById draft.
          items:
            $ref: "#/components/schemas/LinkedApplicationSummaryResponse"
        linkedGroupVersion:
          type: string
          description: >-
            Opaque token identifying the application's linked group and its current version;
            absent when the application is not linked. Pass it back unchanged on link, unlink,
            and make-lead requests. Do not parse it.
        priorAuthorities:
          type: array
          description: Prior authorities raised against the application
          items:
            $ref: "#/components/schemas/PriorAuthoritySummary"

    # getApplications query parameter change (resources.yml): replaces the matterType enum filter
    ApplicationSummaryResponse:
      type: object
      properties:
        paging:
          $ref: "../open-api-common/components.yml#/components/schemas/PagingResponse"
        applications:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationSummary"

    LinkedApplicationSummaryResponse:
      type: object
      description: Summary of another application in the same linked application group
      required:
        - applicationId
        - laaReference
        - isLead
        - clientFirstName
        - clientLastName
      properties:
        applicationId:
          type: string
          format: uuid
          description: Unique identifier for the linked application
        laaReference:
          type: string
          description: LAA reference for the linked application
        isLead:
          type: boolean
          description: Whether the linked application is the lead of the group
        clientFirstName:
          type: string
          description: Client first name on the linked application
        clientLastName:
          type: string
          description: Client last name on the linked application

    PriorAuthoritySummary:
      type: object
      required:
        - priorAuthorityId
        - status
        - createdAt
      properties:
        priorAuthorityId:
          type: string
          format: uuid
        priorAuthorityType:
          type: string
          nullable: true
          enum: [EXPERT, DISBURSEMENT, COUNSEL]
        status:
          type: string
          enum: [DRAFT, SUBMITTED, DECIDED]
        decision:
          type: string
          nullable: true
          enum: [GRANTED, REFUSED]
        createdAt:
          type: string
          format: date-time

    ApplicationHistoryResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationDomainEventResponse"
        priorAuthorities:
          type: array
          items:
            $ref: "#/components/schemas/PriorAuthorityHistoryGroup"

    PriorAuthorityHistoryGroup:
      type: object
      required:
        - priorAuthorityId
        - priorAuthorityType
        - events
      properties:
        priorAuthorityId:
          type: string
          format: uuid
        priorAuthorityType:
          $ref: "../open-api-prior-authority/components.yml#/components/schemas/PriorAuthorityType"
        events:
          type: array
          items:
            $ref: "#/components/schemas/PriorAuthorityEventResponse"

    PriorAuthorityEventResponse:
      type: object
      required:
        - eventType
        - createdAt
        - createdBy
      properties:
        eventType:
          type: string
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        caseworkerId:
          type: string
          format: uuid
        eventDescription:
          type: string

    ApplicationDomainEventResponse:
      type: object
      required:
        - applicationId
        - domainEventType
        - createdAt
        - createdBy
      properties:
        applicationId:
          type: string
          format: uuid
        caseworkerId:
          type: string
          format: uuid
        domainEventType:
          $ref: "../open-api-common/components.yml#/components/schemas/DomainEventType"
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        eventDescription:
          type: string

    DecisionStatus:
      type: string
      enum:
        - GRANTED
        - REFUSED

    MeritsDecisionStatus:
      type: string
      enum:
        - GRANTED
        - REFUSED

    MeritsDecisionDetailsRequest:
      type: object
      required:
        - decision
        - justification
      properties:
        decision:
          $ref: "#/components/schemas/MeritsDecisionStatus"
        reason:
          type: string
        justification:
          type: string

    MakeDecisionProceedingRequest:
      type: object
      required:
        - proceedingId
        - meritsDecision
      properties:
        proceedingId:
          type: string
          format: uuid
        meritsDecision:
          $ref: "#/components/schemas/MeritsDecisionDetailsRequest"

    MakeDecisionRequest:
      type: object
      required:
        - overallDecision
        - proceedings
        - eventHistory
        - applicationVersion
      properties:
        overallDecision:
          $ref: "#/components/schemas/DecisionStatus"
        proceedings:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/MakeDecisionProceedingRequest"
        eventHistory:
          $ref: "../open-api-common/components.yml#/components/schemas/EventHistoryRequest"
        certificate:
          type: object
          additionalProperties: true
          description: Certificate information (required when overallDecision is GRANTED)
        autoGranted:
          type: boolean
          default: false
          description: Whether the decision was made by the auto-grant process
        applicationVersion:
          type: integer
          format: int64
          minimum: 0
          description: Version of the application being decided, used for concurrency control

    AutoGrantOutcome:
      type: string
      enum:
        - AUTOGRANTED
        - MANUAL

    AutoGrantOutcomeRequest:
      type: object
      required:
        - outcome
      properties:
        outcome:
          $ref: "#/components/schemas/AutoGrantOutcome"
      oneOf:
        - $ref: "#/components/schemas/AutoGrantedOutcomeRequest"
        - $ref: "#/components/schemas/ManualOutcomeRequest"
      discriminator:
        propertyName: outcome
        mapping:
          AUTOGRANTED: "#/components/schemas/AutoGrantedOutcomeRequest"
          MANUAL: "#/components/schemas/ManualOutcomeRequest"

    ManualOutcomeRequest:
      type: object
      additionalProperties: false
      required:
        - outcome
      properties:
        outcome:
          $ref: "#/components/schemas/AutoGrantOutcome"

    AutoGrantedOutcomeRequest:
      type: object
      additionalProperties: false
      required:
        - outcome
        - certificate
      properties:
        outcome:
          $ref: "#/components/schemas/AutoGrantOutcome"
        certificate:
          type: object
          minProperties: 1
          additionalProperties: true
          description: Certificate information for the autogranted Decision

    ApplicationProceedingResponse:
      type: object
      required:
        - proceedingId
        - leadProceeding
        - code
        - meaning
        - description
        - matterType
        - matterTypeCode
        - categoryOfLaw
        - categoryOfLawCode
        - clientInvolvementType
        - clientInvolvementTypeCode
        - usedDelegatedFunctions
        - substantiveLevelOfServiceCode
        - substantiveLevelOfServiceName
        - scopeLimitations
        - meritsDecision
      properties:
        proceedingId:
          type: string
          format: uuid
          description: Unique identifier for the proceeding (supplied as id on create)
        leadProceeding:
          type: boolean
          description: Whether this is the lead proceeding
        code:
          type: string
          description: CCMS proceeding code
        meaning:
          type: string
          description: Proceeding meaning
        description:
          type: string
          description: Proceeding description
        matterType:
          type: string
          description: Matter type for the proceeding
        matterTypeCode:
          type: string
          description: Matter type code for the proceeding
        categoryOfLaw:
          type: string
          description: Category of law for the proceeding
        categoryOfLawCode:
          type: string
          description: Category of law code for the proceeding
        clientInvolvementType:
          type: string
          description: Client involvement type description
        clientInvolvementTypeCode:
          type: string
          description: Client involvement type code from legal framework
        usedDelegatedFunctions:
          type: boolean
          description: Whether delegated functions were used
        delegatedFunctionsDate:
          type: string
          format: date
          nullable: true
          description: Date delegated functions were used
        delegatedFunctionsCostLimitation:
          type: number
          nullable: true
          description: Delegated functions cost limitation
          example: 2250.0
        substantiveLevelOfServiceCode:
          type: integer
          description: Substantive level of service code (supplied as substantiveLevelOfService on create)
        substantiveLevelOfServiceName:
          type: string
          description: Substantive level of service name
        emergencyLevelOfServiceCode:
          type: integer
          nullable: true
          description: Emergency level of service code (supplied as emergencyLevelOfService on create)
        emergencyLevelOfServiceName:
          type: string
          nullable: true
          description: Emergency level of service name
        substantiveCostLimitation:
          type: number
          nullable: true
          description: Substantive cost limitation
          example: 2250.0
        scopeLimitations:
          type: array
          minItems: 1
          description: Scope limitations for the proceeding
          items:
            $ref: "#/components/schemas/ScopeLimitationResponse"
        involvedChildren:
          type: array
          description: Children involved in the proceeding
          items:
            $ref: "#/components/schemas/InvolvedChildResponse"
        meritsDecision:
          $ref: "#/components/schemas/MeritsDecisionStatusResponse"

    MeritsDecisionStatusResponse:
      type: string
      description: >-
        Merits decision on a proceeding. PENDING until a decision is made. Response-only;
        command requests use MeritsDecisionStatus.
      enum:
        - PENDING
        - GRANTED
        - REFUSED

    InvolvedChildResponse:
      type: object
      required:
        - firstName
        - lastName
        - dateOfBirth
      properties:
        firstName:
          type: string
          description: First name of the involved child
        lastName:
          type: string
          description: Last name of the involved child
        dateOfBirth:
          type: string
          format: date
          description: Date of birth of the involved child

    ScopeLimitationResponse:
      type: object
      required:
        - code
        - type
        - meaning
        - description
      properties:
        code:
          type: string
          description: Scope limitation code
        type:
          type: string
          description: Scope limitation type
        meaning:
          type: string
          description: Scope limitation meaning
        description:
          type: string
          description: Scope limitation description

    CreateNoteRequest:
      type: object
      required:
        - notes
      properties:
        notes:
          type: string
          minLength: 1
          maxLength: 10000

    ApplicationNoteResponse:
      type: object
      properties:
        note:
          type: string
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string

    ApplicationNotesResponse:
      type: object
      properties:
        notes:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationNoteResponse"

    DocumentUploadResponse:
      type: object
      properties:
        detail:
          type: string
        success:
          type: string
        checksum:
          type: string

    UploadApplicationDocumentResponse:
      type: object
      required:
        - documentId
        - fileName
        - fileType
        - contentType
        - size
        - uploadedAt
        - sourceService
      properties:
        documentId:
          type: string
          format: uuid
        fileName:
          type: string
        fileType:
          type: string
          nullable: true
          example: PDF
        contentType:
          type: string
          nullable: true
          example: application/pdf
        size:
          type: integer
          format: int64
        uploadedAt:
          type: string
          format: date-time
        sourceService:
          type: string
        checksum:
          type: string

    ApplicationDocumentResponse:
      type: object
      required:
        - documentId
        - documentType
        - uploadedAt
      properties:
        documentId:
          type: string
          format: uuid
        documentType:
          type: string
        fileName:
          type: string
          description: Original filename, absent for legacy uploads where it was not recorded
        uploadedAt:
          type: string
          format: date-time
        size:
          type: integer
          format: int64
        contentType:
          type: string
        checksum:
          type: string
        sourceService:
          type: string

    DocumentDownloadResponse:
      type: object
      properties:
        fileURL:
          type: string

    DocumentUpdateResponse:
      type: object
      properties:
        success:
          type: string
        checksum:
          type: string

    DocumentDeleteResult:
      type: object
      properties:
        documentId:
          type: string
          description: The document ID that was requested for deletion
        status:
          type: integer
          description: Per-file status code returned by SDS (204 deleted, 404 not found, 500 error)

    DocumentDeleteResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/DocumentDeleteResult"

    SdsHealthResponse:
      type: object
      properties:
        Health:
          type: string
