components:
  schemas:
    ApplicationSortBy:
      type: string
      enum:
        - LAST_UPDATED_DATE
        - SUBMITTED_DATE

    ApplicationOrderBy:
      type: string
      enum:
        - ASC
        - DESC

    AutoGranted:
      type: string
      description: The current automatic-assessment state of the Application
      enum:
        - PENDING
        - AUTOGRANTED
        - MANUAL

    OpponentResponse:
      type: object
      properties:
        opponentType:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        organisationName:
          type: string

    ApplicationResponse:
      type: object
      required:
        - applicationId
        - status
        - laaReference
        - lastUpdated
        - proceedings
        - applicationVersion
        - autoGranted
      properties:
        applicationId:
          type: string
          format: uuid
        status:
          $ref: "../open-api-common/components.yml#/components/schemas/ApplicationStatus"
        laaReference:
          type: string
        lastUpdated:
          type: string
          format: date-time
        assignedTo:
          type: string
          format: uuid
        submittedAt:
          type: string
          format: date-time
        isLead:
          type: boolean
        usedDelegatedFunctions:
          type: boolean
        autoGranted:
          $ref: "#/components/schemas/AutoGranted"
        decisionStatus:
          $ref: "#/components/schemas/DecisionStatus"
        opponents:
          type: array
          items:
            $ref: "#/components/schemas/OpponentResponse"
        proceedings:
          $ref: "#/components/schemas/ApplicationProceedingsResponse"
        provider:
          $ref: "#/components/schemas/ProviderResponse"
        version:
          type: integer
          format: int64

    ProviderResponse:
      type: object
      properties:
        officeCode:
          type: string
        contactEmail:
          type: string

    ApplicationCreateRequest:
      type: object
      required:
        - id
        - status
        - applicationContent
        - laaReference
      properties:
        id:
          type: string
          format: uuid
          description: The unique reference used to identify the application.
        status:
          $ref: "../open-api-common/components.yml#/components/schemas/ApplicationStatus"
        applicationContent:
          type: object
          description: Application data to create
          additionalProperties: true
          minProperties: 1
        laaReference:
          type: string
          minLength: 1

    ApplicationUpdateRequest:
      type: object
      required:
        - applicationContent
      properties:
        status:
          $ref: "../open-api-common/components.yml#/components/schemas/ApplicationStatus"
        applicationContent:
          type: object
          description: Application data to update
          additionalProperties: true
          minProperties: 1

    ApplicationSummary:
      type: object
      description: (APPLICATION LIST PAGE / VIEW - OPEN APPLICATIONS ONLY BY DEFAULT)
      required:
        - autoGranted
      properties:
        applicationId:
          type: string
          format: uuid
          description: The unique reference used to identify the application.
        status:
          $ref: "../open-api-common/components.yml#/components/schemas/ApplicationStatus"
        submittedAt:
          type: string
          format: date-time
        lastUpdated:
          type: string
          format: date-time
        usedDelegatedFunctions:
          type: boolean
        categoryOfLaw:
          $ref: "../open-api-common/components.yml#/components/schemas/CategoryOfLaw"
        matterType:
          $ref: "../open-api-common/components.yml#/components/schemas/MatterType"
        assignedTo:
          type: string
          format: uuid
        autoGranted:
          $ref: "#/components/schemas/AutoGranted"
        clientFirstName:
          type: string
        clientLastName:
          type: string
        clientDateOfBirth:
          type: string
          format: date
        laaReference:
          type: string
        officeCode:
          type: string
        isLead:
          type: boolean
        linkedApplications:
          type: array
          items:
            $ref: "#/components/schemas/LinkedApplicationSummaryResponse"

    ApplicationSummaryResponse:
      type: object
      properties:
        paging:
          $ref: "../open-api-common/components.yml#/components/schemas/PagingResponse"
        applications:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationSummary"

    LinkedApplicationSummaryResponse:
      type: object
      properties:
        applicationId:
          type: string
          format: uuid
        laaReference:
          type: string
        isLead:
          type: boolean

    ApplicationHistoryResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationDomainEventResponse"

    ApplicationDomainEventResponse:
      type: object
      required:
        - applicationId
        - domainEventType
        - createdAt
        - createdBy
      properties:
        applicationId:
          type: string
          format: uuid
        caseworkerId:
          type: string
          format: uuid
        domainEventType:
          $ref: "../open-api-common/components.yml#/components/schemas/DomainEventType"
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        eventDescription:
          type: string

    DecisionStatus:
      type: string
      enum:
        - GRANTED
        - REFUSED

    MeritsDecisionStatus:
      type: string
      enum:
        - GRANTED
        - REFUSED

    MeritsDecisionDetailsRequest:
      type: object
      required:
        - decision
        - justification
      properties:
        decision:
          $ref: "#/components/schemas/MeritsDecisionStatus"
        reason:
          type: string
        justification:
          type: string

    MakeDecisionProceedingRequest:
      type: object
      required:
        - proceedingId
        - meritsDecision
      properties:
        proceedingId:
          type: string
          format: uuid
        meritsDecision:
          $ref: "#/components/schemas/MeritsDecisionDetailsRequest"

    MakeDecisionRequest:
      type: object
      required:
        - overallDecision
        - proceedings
        - eventHistory
        - applicationVersion
      properties:
        overallDecision:
          $ref: "#/components/schemas/DecisionStatus"
        proceedings:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/MakeDecisionProceedingRequest"
        eventHistory:
          $ref: "../open-api-common/components.yml#/components/schemas/EventHistoryRequest"
        certificate:
          type: object
          additionalProperties: true
          description: Certificate information (required when overallDecision is GRANTED)
        autoGranted:
          type: boolean
          default: false
          description: Whether the decision was made by the auto-grant process
        applicationVersion:
          type: integer
          format: int64
          description: Version of application being decided, used for concurrency control

    AutoGrantOutcome:
      type: string
      enum:
        - AUTOGRANTED
        - MANUAL

    AutoGrantOutcomeRequest:
      type: object
      required:
        - outcome
      properties:
        outcome:
          $ref: "#/components/schemas/AutoGrantOutcome"
      oneOf:
        - $ref: "#/components/schemas/AutoGrantedOutcomeRequest"
        - $ref: "#/components/schemas/ManualOutcomeRequest"
      discriminator:
        propertyName: outcome
        mapping:
          AUTOGRANTED: "#/components/schemas/AutoGrantedOutcomeRequest"
          MANUAL: "#/components/schemas/ManualOutcomeRequest"

    ManualOutcomeRequest:
      type: object
      additionalProperties: false
      required:
        - outcome
      properties:
        outcome:
          $ref: "#/components/schemas/AutoGrantOutcome"

    AutoGrantedOutcomeRequest:
      type: object
      additionalProperties: false
      required:
        - outcome
        - certificate
      properties:
        outcome:
          $ref: "#/components/schemas/AutoGrantOutcome"
        certificate:
          type: object
          minProperties: 1
          additionalProperties: true
          description: Certificate information for the autogranted Decision

    ApplicationProceedingsResponse:
      type: array
      items:
        $ref: "#/components/schemas/ApplicationProceedingResponse"

    ApplicationProceedingResponse:
      type: object
      required:
        - proceedingId
      properties:
        proceedingId:
          type: string
          format: uuid
        proceedingType:
          type: string
        proceedingDescription:
          type: string
        delegatedFunctionsDate:
          type: string
          format: date
        categoryOfLaw:
          $ref: "../open-api-common/components.yml#/components/schemas/CategoryOfLaw"
        matterType:
          $ref: "../open-api-common/components.yml#/components/schemas/MatterType"
        levelOfService:
          type: string
        substantiveCostLimitation:
          type: number
          format: double
        scopeLimitations:
          type: array
          items:
            $ref: "#/components/schemas/ScopeLimitationResponse"
        involvedChildren:
          type: array
          items:
            $ref: "#/components/schemas/InvolvedChildResponse"
        meritsDecision:
          $ref: "#/components/schemas/MeritsDecisionStatus"

    InvolvedChildResponse:
      type: object
      properties:
        fullName:
          type: string
        dateOfBirth:
          type: string
          format: date

    ScopeLimitationResponse:
      type: object
      properties:
        scopeLimitation:
          type: string
        scopeDescription:
          type: string

    CreateNoteRequest:
      type: object
      required:
        - notes
      properties:
        notes:
          type: string
          minLength: 1
          maxLength: 10000

    ApplicationNoteResponse:
      type: object
      properties:
        note:
          type: string
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string

    ApplicationNotesResponse:
      type: object
      properties:
        notes:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationNoteResponse"

    DocumentUploadResponse:
      type: object
      properties:
        detail:
          type: string
        success:
          type: string
        checksum:
          type: string

    DocumentDownloadResponse:
      type: object
      properties:
        fileURL:
          type: string

    DocumentUpdateResponse:
      type: object
      properties:
        success:
          type: string
        checksum:
          type: string

    DocumentDeleteResult:
      type: object
      properties:
        documentId:
          type: string
          description: The document ID that was requested for deletion
        status:
          type: integer
          description: Per-file status code returned by SDS (204 deleted, 404 not found, 500 error)

    DocumentDeleteResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/DocumentDeleteResult"

    SdsHealthResponse:
      type: object
      properties:
        Health:
          type: string

    PriorAuthorityType:
      type: string
      enum:
        - EXPERT
        - DISBURSEMENT
        - COUNSEL

    BillingType:
      type: string
      enum:
        - HOURLY
        - FIXED_RATE

    CounselType:
      type: string
      enum:
        - KINGS_COUNSEL_ALONE
        - TWO_JUNIOR_COUNSEL
        - KINGS_COUNSEL_AND_JUNIOR_COUNSEL
        - KINGS_COUNSEL_AND_TWO_JUNIOR_COUNSEL

    TimeRequested:
      type: object
      required:
        - hours
        - minutes
      properties:
        hours:
          type: integer
          minimum: 0
        minutes:
          type: integer
          minimum: 0
          maximum: 59

    Apportionment:
      type: object
      required:
        - partiesSharingCosts
        - clientShareAmount
      properties:
        partiesSharingCosts:
          type: integer
          minimum: 2
        clientShareAmount:
          type: number
          format: double

    ExpertCosts:
      type: object
      required:
        - billingType
        - totalAmount
        - costsSharedWithOtherParties
      properties:
        billingType:
          $ref: "#/components/schemas/BillingType"
        hourlyRate:
          type: number
          format: double
        timeRequested:
          $ref: "#/components/schemas/TimeRequested"
        totalAmount:
          type: number
          format: double
        costsSharedWithOtherParties:
          type: boolean
        apportionment:
          $ref: "#/components/schemas/Apportionment"

    ExpertDetails:
      type: object
      required:
        - expertType
        - expertFullName
        - expertPostcode
        - expertCosts
      properties:
        expertType:
          type: string
        expertFullName:
          type: string
        expertPostcode:
          type: string
        expertCosts:
          $ref: "#/components/schemas/ExpertCosts"

    CounselDetails:
      type: object
      required:
        - counselType
      properties:
        counselType:
          $ref: "#/components/schemas/CounselType"

    DisbursementDetails:
      type: object
      required:
        - disbursementPurpose
        - disbursementAmount
      properties:
        disbursementPurpose:
          type: string
        disbursementAmount:
          type: number
          format: double

    CreatePriorAuthorityRequest:
      type: object
      required:
        - priorAuthorityType
        - justification
      properties:
        priorAuthorityType:
          $ref: "#/components/schemas/PriorAuthorityType"
        justification:
          type: string
          maxLength: 10000
        expertDetails:
          $ref: "#/components/schemas/ExpertDetails"
        counselDetails:
          $ref: "#/components/schemas/CounselDetails"
        disbursementDetails:
          $ref: "#/components/schemas/DisbursementDetails"

    CreatePriorAuthorityResponse:
      type: object
      required:
        - submissionId
        - submittedAt
      properties:
        submissionId:
          type: string
          format: uuid
        submittedAt:
          type: string
          format: date-time

    SavePriorAuthorityDraftRequest:
      type: object
      properties:
        priorAuthorityType:
          $ref: "#/components/schemas/PriorAuthorityType"
        justification:
          type: string
          maxLength: 10000
        expertDetails:
          $ref: "#/components/schemas/ExpertDetails"
        counselDetails:
          $ref: "#/components/schemas/CounselDetails"
        disbursementDetails:
          $ref: "#/components/schemas/DisbursementDetails"

    SavePriorAuthorityDraftResponse:
      type: object
      required:
        - submissionId
        - savedAt
      properties:
        submissionId:
          type: string
          format: uuid
        savedAt:
          type: string
          format: date-time

    SubmitPriorAuthorityDraftResponse:
      type: object
      required:
        - submissionId
        - submittedAt
      properties:
        submissionId:
          type: string
          format: uuid
        submittedAt:
          type: string
          format: date-time
