components:
  schemas:
    WorkQueueItemType:
      type: string
      enum:
        - APPLICATION
        - PRIOR_AUTHORITY

    WorkQueueItem:
      type: object
      properties:
        itemId:
          type: string
          format: uuid
        itemType:
          $ref: "#/components/schemas/WorkQueueItemType"
        applicationId:
          type: string
          format: uuid
        parentApplicationId:
          type: string
          format: uuid
        assignedTo:
          type: string
          format: uuid
        assignmentVersion:
          type: integer
          format: int64
        assignmentBoundaryType:
          type: string
          enum:
            - DIRECT
            - LINKED_GROUP
        groupId:
          type: string
          format: uuid
        submittedAt:
          type: string
          format: date-time
        laaReference:
          type: string

    WorkQueueResponse:
      type: object
      properties:
        paging:
          $ref: "../open-api-common/components.yml#/components/schemas/PagingResponse"
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkQueueItem"
