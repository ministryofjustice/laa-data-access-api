paths:
  /api/v0/work-queue:
    get:
      tags:
        - work-queue-query
      summary: Get work queue items
      operationId: getWorkQueueItems
      parameters:
        - in: query
          name: assignedTo
          description: Return items assigned to this caseworker UUID (Personal Queue view)
          schema:
            type: string
            format: uuid
        - in: query
          name: unassigned
          description: When true, return only unassigned items (Open Applications view)
          schema:
            type: boolean
        - in: query
          name: itemType
          description: Restrict results to one work-item type
          schema:
            $ref: "./components.yml#/components/schemas/WorkQueueItemType"
        - in: query
          name: page
          description: One-based page number (defaults to 1)
          schema:
            type: integer
        - in: query
          name: pageSize
          description: Number of items per page (defaults to 20, max 100)
          schema:
            type: integer
      responses:
        "200":
          description: Paginated work queue items
          content:
            application/json:
              schema:
                $ref: "./components.yml#/components/schemas/WorkQueueResponse"
