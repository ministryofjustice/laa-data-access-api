paths:
  /api/v0/prior-authorities/{priorAuthorityId}:
    get:
      tags:
        - prior-authority-query
      summary: Retrieve a Prior Authority request by priorAuthorityId, whether it is still an in-progress draft or has already been submitted
      operationId: getPriorAuthority
      parameters:
        - $ref: "../open-api-common/components.yml#/components/parameters/XServiceName"
        - name: priorAuthorityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Prior Authority found
          content:
            application/json:
              schema:
                $ref: "./components.yml#/components/schemas/PriorAuthorityResponse"
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Prior Authority not found }
        '500': { description: Internal server error }
    put:
      tags:
        - prior-authority-drafts
      summary: Update an existing Prior Authority draft
      operationId: updatePriorAuthorityDraft
      parameters:
        - $ref: "../open-api-common/components.yml#/components/parameters/XServiceName"
        - name: priorAuthorityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./components.yml#/components/schemas/SavePriorAuthorityDraftRequest"
      responses:
        '204':
          description: Prior Authority draft updated
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Prior Authority not found }
        '500': { description: Internal server error }

  /api/v0/prior-authorities/{priorAuthorityId}/decision:
    patch:
      tags:
        - prior-authority-command
      summary: Record a decision for a Prior Authority request
      operationId: makePriorAuthorityDecision
      parameters:
        - $ref: "../open-api-common/components.yml#/components/parameters/XServiceName"
        - name: priorAuthorityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        description: event history and decision details for the prior authority request
        content:
          application/json:
            schema:
              $ref: "./components.yml#/components/schemas/MakePriorAuthorityDecisionRequest"
      responses:
        '204': { description: Decision recorded }
        '400': { description: Bad request }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Prior Authority not found }
        '409': { description: Prior Authority already decided or request conflicts with current state }
        '500': { description: Internal server error }

  /api/v0/prior-authorities/{priorAuthorityId}/submit:
    post:
      tags:
        - prior-authority-drafts
      summary: Submit an in-progress Prior Authority draft, sealing its content
      description: |
        This command endpoint does not accept a request body.
        Submit-time content validation requirements are documented in
        [`SubmitPriorAuthorityDraftValidationRequest`](#/components/schemas/SubmitPriorAuthorityDraftValidationRequest).
      operationId: submitPriorAuthorityDraft
      parameters:
        - $ref: "../open-api-common/components.yml#/components/parameters/XServiceName"
        - name: priorAuthorityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Prior Authority draft submitted and projection readable
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "./components.yml#/components/schemas/SubmitPriorAuthorityDraftResponse"
        '202':
          description: Prior Authority draft submitted but projection not yet readable
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "./components.yml#/components/schemas/SubmitPriorAuthorityDraftResponse"
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Prior Authority not found }

  /api/v0/prior-authorities/{priorAuthorityId}/documents:
    post:
      tags:
        - prior-authority-document-command
      summary: Upload a supporting evidence document to a Prior Authority draft
      operationId: uploadPriorAuthorityDocument
      parameters:
        - $ref: "../open-api-common/components.yml#/components/parameters/XServiceName"
        - name: priorAuthorityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Document uploaded and linked to prior authority draft
          content:
            application/json:
              schema:
                $ref: "./components.yml#/components/schemas/UploadPriorAuthorityDocumentResponse"
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Prior Authority not found }
        '409': { description: File conflict }
        '411': { description: Missing content length }
        '500': { description: Internal server error }

  /api/v0/prior-authorities/{priorAuthorityId}/documents/{documentId}:
    patch:
      tags:
        - prior-authority-document-command
      summary: Set or replace the type of a Prior Authority document
      operationId: updatePriorAuthorityDocumentType
      parameters:
        - $ref: "../open-api-common/components.yml#/components/parameters/XServiceName"
        - name: priorAuthorityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./components.yml#/components/schemas/UpdatePriorAuthorityDocumentTypeRequest"
      responses:
        '200':
          description: Document type updated
          content:
            application/json:
              schema:
                $ref: "./components.yml#/components/schemas/PriorAuthorityDocumentTypeUpdateResponse"
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Prior Authority or document not found }
        '409': { description: Document update conflict }
        '500': { description: Internal server error }
    delete:
      tags:
        - prior-authority-document-command
      summary: Delete a supporting evidence document from a Prior Authority draft
      operationId: deletePriorAuthorityDocument
      parameters:
        - $ref: "../open-api-common/components.yml#/components/parameters/XServiceName"
        - name: priorAuthorityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Document deleted from prior authority draft
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Prior Authority or document not found }
        '500': { description: Internal server error }

  /api/v0/prior-authorities/{priorAuthorityId}/documents/{documentId}/content:
    get:
      tags:
        - prior-authority-document-query
      summary: Download a supporting evidence document for a Prior Authority request
      operationId: downloadPriorAuthorityDocument
      parameters:
        - $ref: "../open-api-common/components.yml#/components/parameters/XServiceName"
        - name: priorAuthorityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document content
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Attachment filename
            X-Document-Uploaded-At:
              schema:
                type: string
                format: date-time
              description: Timestamp when the document was uploaded
            X-Document-Type:
              schema:
                type: string
              description: Supporting document type assigned to the document
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Prior Authority or document not found }
        '500': { description: Internal server error }

  /api/v0/prior-authorities:
    post:
      tags:
        - prior-authority-drafts
      summary: Start or save a Prior Authority draft
      operationId: savePriorAuthorityDraft
      parameters:
        - $ref: "../open-api-common/components.yml#/components/parameters/XServiceName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./components.yml#/components/schemas/CreatePriorAuthorityDraftRequest"
      responses:
        '201':
          description: Prior Authority draft created and projection readable
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "./components.yml#/components/schemas/SavePriorAuthorityDraftResponse"
        '202':
          description: Prior Authority draft submitted but projection not yet readable
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "./components.yml#/components/schemas/SavePriorAuthorityDraftResponse"
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Application not found }
