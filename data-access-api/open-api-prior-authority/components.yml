components:
  schemas:
    PriorAuthorityResponse:
      type: object
      required:
        - priorAuthorityId
        - applicationId
      properties:
        priorAuthorityType:
          type: string
          description: One of EXPERT, DISBURSEMENT, COUNSEL
          enum: [EXPERT, DISBURSEMENT, COUNSEL]
        priorAuthorityId:
          type: string
          format: uuid
        applicationId:
          type: string
          format: uuid
        matterType:
          type: string
          description: Retrieved from application by applicationId
        justification:
          type: string
          maxLength: 10000
        decision:
          type: string
          description: Decision on the request. Uses GRANT/REFUSE to match decision API.
          enum: [GRANT, REFUSE]
        decisionJustification:
          type: string
        uploadedDocuments:
          type: array
          items:
            $ref: "#/components/schemas/UploadedDocument"
        expertDetails:
          description: Optional expert details (present when priorAuthorityType is EXPERT)
          $ref: "#/components/schemas/ExpertDetails"
        counselDetails:
          description: Optional counsel details (present when priorAuthorityType is COUNSEL)
          $ref: "#/components/schemas/CounselDetails"
        disbursementDetails:
          description: Optional disbursement details (present when priorAuthorityType is DISBURSEMENT)
          $ref: "#/components/schemas/DisbursementDetails"
        status:
          type: string
          description: Lifecycle status of the prior authority request
          enum: [DRAFT, SUBMITTED]
        assignedTo:
          type: string
          format: uuid
        officeCode:
          type: string

    UploadedDocument:
      type: object
      required:
        - documentId
        - documentType
        - fileName
        - uploadedAt
      properties:
        documentId:
          type: string
          format: uuid
        documentType:
          $ref: "#/components/schemas/PriorAuthorityDocumentType"
        fileName:
          type: string
        fileType:
          type: string
          description: Canonical file format for the stored representation.
          example: PDF
        mediaType:
          type: string
          description: Validated IANA MIME type for the stored representation.
          example: application/pdf
        size:
          type: integer
          format: int64
        uploadedAt:
          type: string
          format: date-time
        sourceService:
          type: string
        checksum:
          type: string

    CreatePriorAuthorityDraftRequest:
      allOf:
        - type: object
          required:
            - applicationId
            - priorAuthorityType
          properties:
            applicationId:
              type: string
              format: uuid
            priorAuthorityType:
              $ref: "#/components/schemas/PriorAuthorityType"
        - $ref: "#/components/schemas/SavePriorAuthorityDraftRequest"

    SavePriorAuthorityDraftRequest:
      type: object
      properties:
        justification:
          type: string
          maxLength: 10000
        expertDetails:
          $ref: "#/components/schemas/ExpertDetails"
        counselDetails:
          $ref: "#/components/schemas/CounselDetails"
        disbursementDetails:
          $ref: "#/components/schemas/DisbursementDetails"

    SubmitPriorAuthorityDraftValidationRequest:
      type: object
      additionalProperties: false
      required:
        - priorAuthorityType
        - justification
      properties:
        priorAuthorityType:
          $ref: "#/components/schemas/PriorAuthorityType"
        justification:
          type: string
          maxLength: 10000
        expertDetails:
          $ref: "#/components/schemas/SubmitExpertDetails"
        counselDetails:
          $ref: "#/components/schemas/SubmitCounselDetails"
        disbursementDetails:
          $ref: "#/components/schemas/SubmitDisbursementDetails"
      oneOf:
        - type: object
          properties:
            priorAuthorityType:
              type: string
              enum: [EXPERT]
          required:
            - expertDetails
        - type: object
          properties:
            priorAuthorityType:
              type: string
              enum: [COUNSEL]
          required:
            - counselDetails
        - type: object
          properties:
            priorAuthorityType:
              type: string
              enum: [DISBURSEMENT]
          required:
            - disbursementDetails

    SubmitExpertDetails:
      type: object
      additionalProperties: false
      required:
        - expertType
        - expertFullName
        - expertPostcode
        - expertCosts
      properties:
        expertType:
          type: string
          minLength: 1
        expertFullName:
          type: string
          minLength: 1
        expertPostcode:
          type: string
          minLength: 1
        expertCosts:
          $ref: "#/components/schemas/SubmitExpertCosts"

    SubmitCounselDetails:
      type: object
      additionalProperties: false
      required:
        - counselType
      properties:
        counselType:
          $ref: "#/components/schemas/CounselType"

    SubmitDisbursementDetails:
      type: object
      additionalProperties: false
      required:
        - disbursementPurpose
        - disbursementAmount
      properties:
        disbursementPurpose:
          type: string
          minLength: 1
        disbursementAmount:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true

    SubmitTimeRequested:
      type: object
      additionalProperties: false
      required:
        - hours
        - minutes
      properties:
        hours:
          type: integer
          minimum: 0
        minutes:
          type: integer
          minimum: 0
          maximum: 59

    SubmitApportionment:
      type: object
      additionalProperties: false
      required:
        - partiesSharingCosts
        - clientShareAmount
      properties:
        partiesSharingCosts:
          type: integer
          minimum: 2
        clientShareAmount:
          type: number
          format: double

    SubmitExpertCosts:
      type: object
      additionalProperties: false
      required:
        - billingType
        - totalAmount
        - costsSharedWithOtherParties
      properties:
        billingType:
          $ref: "#/components/schemas/BillingType"
        hourlyRate:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
        timeRequested:
          $ref: "#/components/schemas/SubmitTimeRequested"
        totalAmount:
          type: number
          format: double
        costsSharedWithOtherParties:
          type: boolean
        apportionment:
          $ref: "#/components/schemas/SubmitApportionment"
      allOf:
        - oneOf:
            - type: object
              properties:
                billingType:
                  type: string
                  enum: [HOURLY]
              required:
                - hourlyRate
                - timeRequested
            - type: object
              properties:
                billingType:
                  type: string
                  enum: [FIXED_RATE]
        - oneOf:
            - type: object
              properties:
                costsSharedWithOtherParties:
                  type: boolean
                  enum: [true]
              required:
                - apportionment
            - type: object
              properties:
                costsSharedWithOtherParties:
                  type: boolean
                  enum: [false]
              not:
                required:
                  - apportionment

    SavePriorAuthorityDraftResponse:
      type: object
      required:
        - priorAuthorityId
        - savedAt
      properties:
        priorAuthorityId:
          type: string
          format: uuid
        savedAt:
          type: string
          format: date-time

    SubmitPriorAuthorityDraftResponse:
      type: object
      required:
        - priorAuthorityId
        - submittedAt
      properties:
        priorAuthorityId:
          type: string
          format: uuid
        submittedAt:
          type: string
          format: date-time

    UploadPriorAuthorityDocumentResponse:
      type: object
      required:
        - documentId
        - documentType
        - fileName
        - fileType
        - contentType
        - size
        - uploadedAt
        - sourceService
      properties:
        documentId:
          type: string
          format: uuid
        documentType:
          $ref: "#/components/schemas/PriorAuthorityDocumentType"
        fileName:
          type: string
        fileType:
          type: string
          example: PDF
        contentType:
          type: string
          example: application/pdf
        size:
          type: integer
          format: int64
        uploadedAt:
          type: string
          format: date-time
        sourceService:
          type: string
        checksum:
          type: string

    PriorAuthorityDocumentType:
      type: string
      enum:
        - gateway_evidence
        - merits_report
        - statement_of_case
        - court_application
        - court_order
        - expert_report
        - court_application_or_order
        - parental_responsibility
        - local_authority_assessment
        - grounds_of_appeal
        - counsel_opinion
        - judgement
        - plf_court_order

    PriorAuthorityType:
      type: string
      enum:
        - EXPERT
        - DISBURSEMENT
        - COUNSEL

    BillingType:
      type: string
      enum:
        - HOURLY
        - FIXED_RATE

    CounselType:
      type: string
      enum:
        - KINGS_COUNSEL_ALONE
        - TWO_JUNIOR_COUNSEL
        - KINGS_COUNSEL_AND_JUNIOR_COUNSEL
        - KINGS_COUNSEL_AND_TWO_JUNIOR_COUNSEL

    TimeRequested:
      type: object
      properties:
        hours:
          type: integer
          minimum: 0
        minutes:
          type: integer
          minimum: 0
          maximum: 59

    Apportionment:
      type: object
      properties:
        partiesSharingCosts:
          type: integer
          minimum: 2
        clientShareAmount:
          type: number
          format: double

    ExpertCosts:
      type: object
      properties:
        billingType:
          $ref: "#/components/schemas/BillingType"
        hourlyRate:
          type: number
          format: double
        timeRequested:
          $ref: "#/components/schemas/TimeRequested"
        totalAmount:
          type: number
          format: double
        costsSharedWithOtherParties:
          type: boolean
        apportionment:
          $ref: "#/components/schemas/Apportionment"

    ExpertDetails:
      type: object
      properties:
        expertType:
          type: string
        expertFullName:
          type: string
        expertPostcode:
          type: string
        expertCosts:
          $ref: "#/components/schemas/ExpertCosts"

    CounselDetails:
      type: object
      properties:
        counselType:
          $ref: "#/components/schemas/CounselType"

    DisbursementDetails:
      type: object
      properties:
        disbursementPurpose:
          type: string
        disbursementAmount:
          type: number
          format: double
