import io.swagger.v3.parser.core.models.ParseOptions

plugins {
    id 'org.openapi.generator'
    id 'uk.gov.justice.service.laa.laa-spring-boot-gradle-plugin'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation('org.springframework.boot:spring-boot-starter-web') {
        exclude group: 'com.google.code.gson', module: 'gson'
    }

    implementation 'org.springframework.security:spring-security-core'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.13'

}

publishing {
    publications {
        gpr(MavenPublication) {
            from(components.java)
        }
    }
}

sourceSets.main.java.srcDirs += ['generated/src/main/java']

checkstyleMain.exclude("*")

openApiGenerate {
    generatorName = "spring"
    inputSpec = "$rootDir/data-access-api/open-api-specification.yml".toString()
    outputDir = "$rootDir/data-access-api/generated".toString()
    apiPackage = "uk.gov.justice.laa.dstew.access.api"
    invokerPackage = "uk.gov.justice.laa.dstew.access.invoker"
    modelPackage = "uk.gov.justice.laa.dstew.access.model"
    configOptions = [
            generateBuilders    : "true",
            interfaceOnly       : "true", // This will only generate interfaces, not implementations
            openApiNullable     : "false", // Keep nullable scalar properties as boxed Java types
            serializableModel   : "true",
            skipDefaultInterface: "true",
            useJakartaEe        : "true",
            useSpringBoot4      : "true",
            useTags             : "true",
    ]
    globalProperties = [
            models              : "", // omitting `supportingFiles` prevents generation of
            apis                : "", // pom.xml, README.md, ApiUtil.java, etc.
    ]
}

tasks.named('openApiGenerate') {
    inputs.files(fileTree(projectDir) {
        include '**/*.yml'
        exclude 'build/**', 'generated/**'
    }).withPathSensitivity(PathSensitivity.RELATIVE)
}

compileJava.dependsOn('openApiGenerate')

// Bundles the multi-file spec into one resolved document on the classpath so the service can
// publish documentation-only schemas that springdoc cannot derive from the generated code.
// Inline schemas (for example oneOf branches) are kept inline rather than flattened.
def openApiBundleDir = layout.buildDirectory.dir('openapi-bundle')
tasks.register('bundleOpenApiSpec') {
    def specFile = file('open-api-specification.yml')
    inputs.files(fileTree(projectDir) {
        include '**/*.yml'
        exclude 'build/**', 'generated/**'
    }).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.dir(openApiBundleDir)
    doLast {
        def options = new ParseOptions()
        options.resolve = true
        options.flatten = false
        def result = new io.swagger.v3.parser.OpenAPIV3Parser().readLocation(specFile.toURI().toString(), null, options)
        if (result.openAPI == null) {
            throw new GradleException("Unable to bundle OpenAPI spec: ${result.messages}")
        }
        def output = openApiBundleDir.get().file('openapi/openapi.yaml').asFile
        output.parentFile.mkdirs()
        output.text = io.swagger.v3.core.util.Yaml31.pretty(result.openAPI)
    }
}

tasks.named('processResources') {
    from(tasks.named('bundleOpenApiSpec'))
}

clean {
    delete("$rootDir/data-access-api/generated")
}

// disable for overall project when running a build
tasks.named('bootJar') {
    enabled = false
}

tasks.named('bootRun') {
    enabled = false
}

tasks.named('bootBuildImage') {
    enabled = false
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
