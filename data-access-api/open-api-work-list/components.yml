components:
  schemas:
    WorkListItemType:
      type: string
      enum:
        - APPLICATION
        - PRIOR_AUTHORITY

    WorkListItem:
      type: object
      properties:
        itemId:
          type: string
          format: uuid
          description: Application ID for an application item, or prior-authority submission ID for a PA item
        itemType:
          $ref: "#/components/schemas/WorkListItemType"
        parentApplicationId:
          type: string
          format: uuid
          description: Parent application ID for a prior-authority item; used as its assignment-history target and omitted for application items
        assignedTo:
          type: string
          format: uuid
        assignmentVersion:
          type: integer
          format: int64
          description: Version of the item's assignment. It increments whenever the assignment changes. Use this value as `expectedAssignmentVersion` in assign and unassign requests
        assignmentBoundaryType:
          type: string
          enum:
            - DIRECT
            - LINKED_GROUP
        submittedAt:
          type: string
          format: date-time
          description: When this work item was first submitted (application creation, or prior authority submission)
        autoGranted:
          allOf:
            - $ref: "../open-api-applications/components.yml#/components/schemas/AutoGranted"
          description: Auto-grant state of an application item; omitted for prior-authority items, which never go through the auto-grant check
        laaReference:
          type: string
          description: LAA reference for the application item or the parent application of a PA item
        usedDelegatedFunctions:
          type: boolean
          description: Whether the application used delegated functions; omitted for PA items
        categoryOfLaw:
          type: string
          description: Category of law of the parent application's lead proceeding; omitted for prior authority items
        categoryOfLawCode:
          type: string
          description: Category of law code of the parent application's lead proceeding; omitted for prior authority items
        matterTypes:
          type: array
          description: Distinct matter type/code pairs from the application (or prior authority parent) proceedings in proceeding order; index i has its code at index i of matterTypeCodes
          items:
            type: string
        matterTypeCodes:
          type: array
          description: Codes paired by index with matterTypes, from distinct matter type/code pairs in proceeding order
          items:
            type: string
        applicationStatus:
          $ref: "../open-api-common/components.yml#/components/schemas/ApplicationStatus"
        priorAuthorityType:
          allOf:
            - $ref: "../open-api-prior-authority/components.yml#/components/schemas/PriorAuthorityType"
          description: Prior-authority type; null for application items
        expertType:
          type: string
          description: Expert type when priorAuthorityType is EXPERT; null otherwise

    WorkListResponse:
      type: object
      properties:
        paging:
          $ref: "../open-api-common/components.yml#/components/schemas/PagingResponse"
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkListItem"

    WorkListAssignRequest:
      type: object
      required:
        - expectedAssignmentVersion
      properties:
        expectedAssignmentVersion:
          type: integer
          format: int64
          minimum: 0
          description: The item's current `assignmentVersion`, from the work list or the item's details. The request is rejected with 409 when it is stale
        eventHistory:
          $ref: "../open-api-common/components.yml#/components/schemas/EventHistoryRequest"

    WorkListAssignedItem:
      type: object
      required:
        - itemId
        - laaReference
      properties:
        itemId:
          type: string
          format: uuid
          description: Application ID for an application item, or prior-authority submission ID for a PA item
        laaReference:
          type: string
          description: LAA reference for the application item or the parent application of a PA item

    WorkListAssignResponse:
      type: object
      required:
        - assignedItems
      properties:
        assignedItems:
          type: array
          description: Every item assigned by the request, with the addressed item first
          items:
            $ref: "#/components/schemas/WorkListAssignedItem"

    WorkListUnassignRequest:
      type: object
      required:
        - expectedAssignmentVersion
      properties:
        expectedAssignmentVersion:
          type: integer
          format: int64
          minimum: 0
          description: The item's current `assignmentVersion`, from the work list or the item's details. The request is rejected with 409 when it is stale
        eventHistory:
          $ref: "../open-api-common/components.yml#/components/schemas/EventHistoryRequest"
