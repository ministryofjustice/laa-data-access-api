paths:
  /api/v0/work-list:
    get:
      tags:
        - work-list-query
      summary: Get work-list items
      operationId: getWorkListItems
      parameters:
        - $ref: "../open-api-common/components.yml#/components/parameters/XServiceName"
        - in: query
          name: assignedToMe
          description: Return items assigned to the authenticated caseworker's Entra OID. Defaults to false.
          schema:
            type: boolean
            default: false
        - in: query
          name: unassigned
          description: Include unassigned items. Defaults to true. At least one of unassigned or assignedToMe must be true.
          schema:
            type: boolean
        - in: query
          name: itemType
          description: Restrict results to one work-item type
          schema:
            $ref: "./components.yml#/components/schemas/WorkListItemType"
        - in: query
          name: page
          description: One-based page number (defaults to 1)
          schema:
            type: integer
        - in: query
          name: pageSize
          description: Number of items per page (defaults to 20, max 100)
          schema:
            type: integer
      responses:
        "200":
          description: Paginated work-list items
          content:
            application/json:
              schema:
                $ref: "./components.yml#/components/schemas/WorkListResponse"
        "400": { description: At least one of assignedToMe or unassigned must be true }

  /api/v0/work-list/{itemId}/assign:
    post:
      tags:
        - work-list-command
      summary: Assign an open work-list item to the authenticated caseworker
      description: When the item is an application in a linked group, every active member of the group is assigned to the caller in the same request; the request fails without changes if any member cannot be assigned.
      operationId: assignWorkListItem
      parameters:
        - $ref: "../open-api-common/components.yml#/components/parameters/XServiceName"
        - name: itemId
          in: path
          required: true
          description: Application ID for an application item, or prior-authority submission ID for a PA item
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        description: Supplies optimistic-concurrency and optional audit detail; the assignee is derived from the authenticated Entra OID.
        content:
          application/json:
            schema:
              $ref: "./components.yml#/components/schemas/WorkListAssignRequest"
      responses:
        "200": { description: OK }
        "400": { description: Bad request }
        "401": { description: Unauthorized }
        "403": { description: Forbidden }
        "404": { description: Work item or route not found }
        "409": { description: Assignment version is stale, the item is already assigned, or the linked group changed during the request }

  /api/v0/work-list/{itemId}/unassign:
    post:
      tags:
        - work-list-command
      summary: Return an assigned work-list item to the unassigned list
      description: When the item is an application in a linked group, every assigned active member of the group is unassigned in the same request.
      operationId: unassignWorkListItem
      parameters:
        - $ref: "../open-api-common/components.yml#/components/parameters/XServiceName"
        - name: itemId
          in: path
          required: true
          description: Application ID for an application item, or prior-authority submission ID for a PA item
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./components.yml#/components/schemas/WorkListUnassignRequest"
      responses:
        "200": { description: OK }
        "400": { description: Bad request }
        "401": { description: Unauthorized }
        "403": { description: Forbidden }
        "404": { description: Work item or route not found }
        "409": { description: Assignment version is stale, the item is not assigned, or the linked group changed during the request }
