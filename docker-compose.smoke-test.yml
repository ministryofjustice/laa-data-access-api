services:
  postgres-smoketest:
    image: postgres:17
    container_name: laa-postgres-smoketest
    restart: unless-stopped
    ports:
      - "6432:5432"
    environment:
      POSTGRES_DB: laa_data_access_api
      POSTGRES_USER: laa_user
      POSTGRES_PASSWORD: laa_password
    volumes:
      - pgdata-smoketest:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laa_user -d laa_data_access_api"]
      interval: 10s
      timeout: 5s
      retries: 5

  mock-oauth2-server-smoketest:
    # Version: 6.0.2 (also update: docker-compose.yml, build.gradle integrationTestImplementation)
    image: ghcr.io/navikt/mock-oauth2-server:6.0.2
    container_name: laa-mock-oauth2-smoketest
    restart: unless-stopped
    ports:
      - "9998:9999"
    environment:
      SERVER_PORT: 9999
      JSON_CONFIG_PATH: /etc/mock-oauth2/config.json
    volumes:
      - ./infra/mock-oauth2/config-smoke-test.json:/etc/mock-oauth2/config.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9999/entra/.well-known/openid-configuration || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  sds-wiremock-smoketest:
    image: wiremock/wiremock:3.13.1
    container_name: laa-sds-wiremock-smoketest
    restart: unless-stopped
    command: ["--global-response-templating"]
    volumes:
      - ./infra/wiremock/sds/mappings:/home/wiremock/mappings:ro

  app-smoketest:
    build:
      context: .
      dockerfile: Dockerfile.axon
    container_name: laa-data-access-api-smoketest
    restart: unless-stopped
    ports:
      - "9000:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s

    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-smoketest:5432/laa_data_access_api
      SPRING_DATASOURCE_USERNAME: laa_user
      SPRING_DATASOURCE_PASSWORD: laa_password
      # Entra / OAuth2 — points to mock-oauth2-server for smoke tests
      ENTRA_ISSUER_URI: http://mock-oauth2-server-smoketest:9999/entra
      ENTRA_JWK_SET_URI: http://mock-oauth2-server-smoketest:9999/entra/jwks
      ENTRA_AUD: laa-data-access-api
      # Outbound SDS OAuth2 and API — points to WireMock for document BDD scenarios
      AUTH_CLIENT_ID: smoke-client
      AUTH_CLIENT_SECRET: smoke-secret
      AUTH_SCOPE: sds.mock
      AUTH_TENANT_ID: smoke
      SDS_API_URL: http://sds-wiremock-smoketest:8080
      SDS_API_TOKEN_URI: http://sds-wiremock-smoketest:8080/oauth/token
      SDS_API_BUCKET: smoke-test-bucket
      SDS_API_CLIENT_REGISTRATION_ID: smoke-sds
      SDS_API_PRINCIPAL_NAME: smoke-sds
      # Sentry (disabled locally by default)
      SENTRY_ENABLED: ${SENTRY_ENABLED:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}
      FEATURE_ENABLE_DEV_TOKEN: true
      FEATURE_DISABLE_SECURITY: false
    depends_on:
      postgres-smoketest:
        condition: service_healthy
      mock-oauth2-server-smoketest:
        condition: service_healthy
      sds-wiremock-smoketest:
        condition: service_started

volumes:
  pgdata-smoketest:
